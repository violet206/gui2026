<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><title>预测实验室 · Prediction Lab</title><meta name="viewport" content="width=device-width,initial-scale=1"/><link rel="stylesheet" href="styles.css"/><link rel="stylesheet" href="shared-ui.css"/><script src="utils.js"></script><style>
body{margin:0;font-family:Roboto,Arial,sans-serif;height:100vh;display:flex;flex-direction:column;background:transparent;overflow:hidden;}
body.themed-page:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 42% 38%,rgba(40,120,160,.28),rgba(5,25,45,.88));z-index:-3;}
video.bg-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-4;opacity:0;transition:opacity 1.2s ease;filter:brightness(.9) saturate(1.06);}video.bg-video.ready{opacity:1}
header{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:14px 24px;background:linear-gradient(145deg,rgba(255,255,255,0.08),rgba(255,255,255,0.02));border:1px solid rgba(255,255,255,0.14);backdrop-filter:blur(14px) saturate(1.35);border-radius:0 0 22px 22px;box-shadow:0 10px 28px -10px rgba(0,0,0,0.55);}
main{flex:1 1 auto;display:flex;min-height:0;padding:26px 30px 34px;gap:20px;}
.grid{flex:1 1 auto;display:grid;grid-template-columns:360px 1fr;gap:20px;min-height:0;}
@media (max-width:1100px){ .grid{grid-template-columns:320px 1fr;} }
@media (max-width:900px){ .grid{grid-template-columns:1fr;grid-auto-rows:minmax(260px,auto);} }
.panel{background:linear-gradient(145deg,rgba(255,255,255,0.07),rgba(255,255,255,0.02));border:1px solid rgba(255,255,255,0.12);padding:18px 20px;border-radius:22px;display:flex;flex-direction:column;min-height:0;box-shadow:0 8px 28px -8px rgba(0,0,0,0.55);backdrop-filter:blur(14px) saturate(1.35);}
h3{margin:0 0 12px;font-size:16px;letter-spacing:.5px;color:#d6f3ff;}
canvas{width:100%!important;height:100%!important}
.chart-box{flex:1 1 auto;min-height:0;position:relative;display:flex;flex-direction:column;}
#fallback{display:none;font-size:12px}
#predChart{height:100%!important}
.panel-controls{display:flex;flex-direction:column;gap:12px;flex:1 1 auto;overflow:auto;}
.panel-controls label{margin-top:6px;}
.panel-controls input[type=range]{accent-color:#35c4ff;}
select#modelType{backdrop-filter:blur(6px);}
button#btnGen{background:linear-gradient(145deg, rgba(0,180,255,0.22), rgba(0,120,255,0.28));border:1px solid rgba(0,180,255,0.55);color:#dff7ff;transition:.25s;font-weight:600;letter-spacing:.5px;}
button#btnGen:hover{box-shadow:0 0 0 3px rgba(53,196,255,0.28);transform:translateY(-2px);}
</style></head><body class="themed-page">
<video id="bgVidLab" class="bg-video" muted autoplay loop playsinline preload="auto" poster="imgs/deep_blue_ocean_gradient_abstract_background_scientific.jpg"><source src="https://cdn.pixabay.com/video/2016/09/13/5200-183786525_large.mp4" type="video/mp4"></video>
<header class="frost-header"><div>📈 预测实验室</div><nav><a href="main.html" class="back-link small">← 返回主页面</a></nav></header><main>
<div class="grid">
  <div class="panel">
  <h3 style="font-size:18px;letter-spacing:.5px;">数据生成 & 选项</h3>
    <div class="panel-controls">
      <div>
        <label style="font-size:14px;opacity:.9;font-weight:500;">年份范围 Years</label>
        <input type="range" id="years" min="8" max="25" value="15" style="width:100%">
        <span id="yearsVal" style="font-size:14px;font-weight:600;">15</span>
      </div>
      <div>
        <label style="font-size:14px;opacity:.9;font-weight:500;">噪声幅度 Noise</label>
        <input type="range" id="noise" min="2" max="30" value="10" style="width:100%">
        <span id="noiseVal" style="font-size:14px;font-weight:600;">10</span>
      </div>
      <div>
        <label style="font-size:14px;opacity:.9;font-weight:500;">模型 Model</label>
        <select id="modelType" style="width:100%;padding:6px 8px;border-radius:10px;background:rgba(0,0,0,0.35);color:#e3f6ff;border:1px solid #1d5a77;font-size:13px;">
          <option value="mlp" selected>MLP(1×H)</option>
          <option value="linear">线性回归</option>
          <option value="both">对比: 线性 + MLP</option>
        </select>
      </div>
      <div>
        <label style="font-size:14px;opacity:.9;font-weight:500;">隐藏层神经元 Hidden (H)</label>
        <input type="range" id="hidden" min="4" max="32" value="8" style="width:100%">
        <span id="hiddenVal" style="font-size:14px;font-weight:600;">8</span>
      </div>
      <div>
        <label style="font-size:14px;opacity:.9;font-weight:500;">训练轮数 Epochs</label>
        <input type="range" id="epochs" min="300" max="3000" step="100" value="1200" style="width:100%">
        <span id="epochsVal" style="font-size:14px;font-weight:600;">1200</span>
      </div>
      <div><label style="font-size:14px"><input type="checkbox" id="policyFlag" checked> 启用政策变量 (示意)</label></div>
      <button id="btnGen" style="margin-top:4px;padding:8px 16px;border-radius:18px;background:#0d3a50;color:#d5f2ff;border:1px solid #1d5a77;cursor:pointer;font-size:14px;">生成 / 训练</button>
      <div id="regStats" style="font-size:13px;line-height:1.55;">等待...</div>
      <div style="font-size:11px;line-height:1.4;opacity:.7;margin-top:4px;">说明: MLP 为前端纯 JS 实现的单隐藏层全批量训练，仅用于趋势演示。噪声越大、年份越少结果不稳定。'对比' 模式同时显示两种方法。</div>
    </div>
  </div>
  <div class="panel">
    <h3>历史 + 预测 History & Forecast</h3>
    <div class="chart-box"><canvas id="predChart"></canvas><div id="fallback">Chart.js 不可用，使用表格。</div></div>
  </div>
</div>
</main>
<script>
const U=window.__UTILS__;
const ysEl=years, noiseEl=noise, hiddenEl=hidden, epochsEl=epochs, modelTypeEl=modelType;
const updateLabels=()=>{ yearsVal.textContent=ysEl.value; noiseVal.textContent=noiseEl.value; hiddenVal.textContent=hiddenEl.value; epochsVal.textContent=epochsEl.value; };
ysEl.oninput = noise.oninput = hiddenEl.oninput = epochsEl.oninput = function(){ updateLabels(); generate(); };
modelTypeEl.onchange=()=>generate();
updateLabels();
document.getElementById('btnGen').onclick=generate;
let chartInstance=null; async function generate(){ const n=+ysEl.value; const noise=+noiseEl.value; const withPolicy=policyFlag.checked; const yearsArr=[]; const base=[]; const policy=[]; for(let i=0;i<n;i++){ yearsArr.push(2010+i); const trend = 120 + i*5; const val = trend + (Math.random()-0.5)*noise; base.push(+val.toFixed(2)); policy.push( withPolicy? +(val * (0.95 - 0.01*i) ).toFixed(2) : +val.toFixed(2)); }
  const xs=yearsArr.map((y,i)=>i); const futureYears=5; const modelSel=modelTypeEl.value; const results={};
  // 线性基线
  const reg = U.linearRegression(xs, base);
  const linearForecast=[]; for(let j=1;j<=futureYears;j++){ const x=n-1+j; linearForecast.push({year: yearsArr[yearsArr.length-1]+j, value: reg.predict(x)}); }
  results.linear={reg, forecast:linearForecast};
  // MLP 训练
  const mlpHidden=+hiddenEl.value; const mlpEpochs=+epochsEl.value; const mlp = trainMLP(xs, base, {hidden:mlpHidden, epochs:mlpEpochs, lr:0.04});
  const mlpForecast=[]; for(let j=1;j<=futureYears;j++){ const x=n-1+j; mlpForecast.push({year: yearsArr[yearsArr.length-1]+j, value: mlp.predict(x)}); }
  results.mlp={mlp, forecast:mlpForecast};
  renderStats(results, base, futureYears);
  if(!await U.ensureChartJS()){ renderFallback(yearsArr, base, mlpForecast); return; }
  const allYears = yearsArr.concat( (modelSel==='linear'? linearForecast: mlpForecast).map(f=>f.year) );
  const datasets=[ {label:'历史值', data: base.concat(Array(futureYears).fill(null)), borderColor:'#4cc9f0', tension:.25}, {label:'政策情景', data: policy.concat(Array(futureYears).fill(null)), borderColor:'#ffb703', tension:.25} ];
  if(modelSel==='linear' || modelSel==='both'){
    datasets.push({label:'线性预测', data: yearsArr.map((_,i)=> reg.predict(i)).concat(linearForecast.map(f=>f.value)), borderColor:'#f72585', borderDash:[4,4], tension:.25}); }
  if(modelSel==='mlp' || modelSel==='both'){
    datasets.push({label:'MLP 拟合+预测', data: yearsArr.map((_,i)=> mlp.predTrain[i]).concat(mlpForecast.map(f=>f.value)), borderColor:'#ffe66d', backgroundColor:'rgba(255,230,109,0.15)', tension:.25}); }
  const ctx=document.getElementById('predChart').getContext('2d'); if(chartInstance) chartInstance.destroy(); chartInstance=new Chart(ctx,{ type:'line', data:{ labels: allYears, datasets }, options:{ plugins:{legend:{labels:{color:'#def'}}}, scales:{x:{ticks:{color:'#9ec3d6'}},y:{ticks:{color:'#9ec3d6'}}} } }); }
function renderStats(results, base, futureN){
  let html='';
  if(results.linear){ const {reg, forecast}=results.linear; const residuals=base.map((v,i)=> v - reg.predict(i)); const mse=residuals.reduce((a,b)=>a+b*b,0)/residuals.length; html+=`<b>[线性]</b> slope=${reg.m.toFixed(3)} intercept=${reg.b.toFixed(2)} MSE=${mse.toFixed(3)} 未来${futureN}年: ${forecast.map(f=>f.value.toFixed(1)).join(', ')}<br>`; }
  if(results.mlp){ const {mlp, forecast}=results.mlp; html+=`<b>[MLP]</b> hidden=${mlp.hidden} epochs=${mlp.epochs} loss=${mlp.finalLoss.toFixed(4)} R²=${mlp.r2.toFixed(3)} 未来${futureN}年: ${forecast.map(f=>f.value.toFixed(1)).join(', ')}`; }
  regStats.innerHTML=html; }
// ===== MLP 实现 (单特征 index -> value) =====
function trainMLP(xs, ys, {hidden=8, epochs=1200, lr=0.04}={}){
  const n=xs.length; const xMax = Math.max(...xs); const yMin=Math.min(...ys), yMax=Math.max(...ys);
  const Xn=xs.map(x=> xMax? x/xMax : 0); const Yn=ys.map(y=> (y - yMin)/(yMax - yMin || 1));
  let W1=new Array(hidden).fill(0).map(()=> (Math.random()*2-1)*0.4); let B1=new Array(hidden).fill(0);
  let W2=new Array(hidden).fill(0).map(()=> (Math.random()*2-1)*0.4); let B2=0;
  function fwd(x){ const z1=W1.map((w,i)=> w*x + B1[i]); const a1=z1.map(v=> v>0?v:0); const yhat=a1.reduce((s,v,i)=> s+v*W2[i], B2); return {z1,a1,yhat}; }
  for(let ep=0; ep<epochs; ep++){
    let dW1=new Array(hidden).fill(0), dB1=new Array(hidden).fill(0), dW2=new Array(hidden).fill(0), dB2=0, loss=0;
    for(let i=0;i<n;i++){
      const {z1,a1,yhat}=fwd(Xn[i]); const err=yhat - Yn[i]; loss+= err*err;
      for(let h=0;h<hidden;h++){ dW2[h]+= err * a1[h]; }
      dB2+=err;
      for(let h=0;h<hidden;h++){ const g = err * W2[h] * (z1[h]>0?1:0); dW1[h]+= g * Xn[i]; dB1[h]+= g; }
    }
    const scale=1/n; loss*=scale;
    for(let h=0;h<hidden;h++){ W2[h]-=lr*dW2[h]*scale; W1[h]-=lr*dW1[h]*scale; B1[h]-=lr*dB1[h]*scale; }
    B2-= lr*dB2*scale;
    if(ep%500===0) console.log('[PredictionLab][MLP] epoch',ep,'loss',loss.toFixed(5));
  }
  // 训练预测与 R²
  const predTrain = xs.map((x,i)=>{ const {yhat}=fwd(xMax? x/xMax:0); return yhat; });
  const yMean = Yn.reduce((a,b)=>a+b,0)/n; const ssTot=Yn.reduce((s,v)=>s+(v-yMean)**2,0); const ssRes=Yn.reduce((s,v,i)=> s+(v-predTrain[i])**2,0); const r2 = ssTot? 1-ssRes/ssTot : 0;
  function predict(x){ const xn = xMax? x/xMax:0; const {yhat}=fwd(xn); return yhat*(yMax - yMin || 1)+yMin; }
  return {hidden, epochs, predict, r2, predTrain: predTrain.map(p=> p*(yMax - yMin || 1)+yMin), finalLoss: ssRes/n};
}
function renderFallback(yearsArr, base, forecast){ const fb=document.getElementById('fallback'); fb.style.display='block'; fb.innerHTML='<table class="basic"><tr><th>Year</th><th>Value</th></tr>'+ yearsArr.map((y,i)=>`<tr><td>${y}</td><td>${base[i]}</td></tr>`).join('') + forecast.map(f=>`<tr><td>${f.year}</td><td>${f.value.toFixed(2)}</td></tr>`).join('') + '</table>'; }
generate();
// 背景视频就绪处理：若长时间无法播放则移除避免黑屏
(function(){const v=document.getElementById('bgVidLab');if(!v) return;let ok=false;const to=setTimeout(()=>{if(!ok) v.parentNode&&v.parentNode.removeChild(v);},12000);v.addEventListener('canplay',()=>{ok=true;clearTimeout(to);v.classList.add('ready');},{once:true});v.addEventListener('error',()=>{clearTimeout(to);v.parentNode&&v.parentNode.removeChild(v);});})();
</script></body></html>
