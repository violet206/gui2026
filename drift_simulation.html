    <style>
        /* === 与起始页统一的背景与字体增强 === */
        body{background:linear-gradient(135deg,#061c2b 0%,#0f3447 55%,#143d52 100%);font-family:Roboto,Inter,system-ui,sans-serif;}

        /* 返回按钮与 explore 同风格 */
        .landing-back-btn{cursor:pointer;padding:6px 14px;font-size:12px;letter-spacing:.1em;border:1px solid rgba(168,218,220,0.5);background:rgba(0,0,0,0.25);color:#e0fbfc;border-radius:16px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background .25s,border-color .25s;display:inline-block;text-decoration:none;margin-bottom:12px;}
        .landing-back-btn:hover{background:rgba(255,255,255,0.12);border-color:rgba(168,218,220,0.7);}        
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --backdrop-filter: blur(20px);
            --radius-large: 20px;
            --radius-medium: 15px;
            --radius-small: 8px;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --accent-blue: #4fc3f7;
            --accent-green: #81c784;
            --accent-orange: #ffb74d;
            --shadow-glass: 0 8px 32px rgba(31, 38, 135, 0.37);
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        .background-animation {
            width:100%;
            height:100%;
            background:
                radial-gradient(circle at 20% 80%, rgba(120,190,255,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(120,255,190,0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255,190,120,0.1) 0%, transparent 50%);
            animation:backgroundShift 20s ease-in-out infinite;
        }

        @keyframes backgroundShift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-20px, -30px) scale(1.05); }
            66% { transform: translate(20px, 30px) scale(0.95); }
        }

        /* 侧边栏 */
        .sidebar {
            position: fixed;
            left: 20px;
            top: 20px;
            bottom: 20px;
            width: 350px;
            background: var(--glass-bg);
            backdrop-filter: var(--backdrop-filter);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-large);
            box-shadow: var(--shadow-glass);
            padding: 30px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        /* 主要内容区域 */
        .main-content {
            margin-left: 390px;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 地图容器 */
        .map-container {
            flex: 1;
            background: var(--glass-bg);
            backdrop-filter: var(--backdrop-filter);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-large);
            box-shadow: var(--shadow-glass);
            position: relative;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100%;
            min-height: 500px;
            display: block;
            z-index: 1;
        }

        /* 标题和控件 */
        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* 返回按钮 */
        .back-button {
            display: inline-flex;
            align-items: center;
            padding: 12px 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-small);
            color: var(--text-primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        }

            border-radius: var(--radius-small);
            color: var(--text-primary);

        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
            border-color: transparent;
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--accent-orange), #ff8a65);

        .stat-value {

            color: var(--accent-blue);

        }

        .stat-label {

        }

        /* 响应式设计 */
        @media (max-width: 1200px) {

        @media (max-width: 968px) {

                left: -350px;
                top: 0;
                bottom: 0;

            }

            .sidebar-toggle {
                position: fixed;
                top: 20px;
                left: 20px;

                border: 1px solid var(--glass-border);

        .particle {

            background: var(--accent-blue);

        .particle-trail {

        }

        /* 加载动画 */
        .loading {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
        }

        .loading::after {
            content: "";
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--glass-border);
            border-top: 2px solid var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

    <script>
        // 背景视频回退
        (function initBg(){const v=document.getElementById('bg-video');if(!v)return;let ok=false;const to=setTimeout(()=>{if(!ok&&v.parentElement){v.parentElement.removeChild(v);}},12000);v.addEventListener('canplay',()=>{ok=true;clearTimeout(to);v.classList.add('bg-video-ready');},{once:true});v.addEventListener('error',()=>{clearTimeout(to);v.parentElement&&v.parentElement.removeChild(v);});})();
        // file:// 模式提示
        if(location.protocol==='file:'){console.warn('[Drift] file:// 模式运行，可能使用模拟数据');}
        // 全局变量
        let animationId;
        let particles = [];
        let isSimulationRunning = false;
        let simulationStartTime = 0;
        let currentDay = 0;

        // 随机洋流系统 - 基于Perlin噪声的动态流场
        let globalNoiseField;
        let autoCurrentsInterval; // 自动随机洋流定时器
        let particleKillInterval; // 粒子随机杀死定时器
        
        // 陆地搁浅优化系统
        let tidalCycle = 0; // 潮汐周期 (0-1)
        let tidalSpeed = 0.001; // 潮汐变化速度
        
        // 洋流方向连续性控制
        let previousCurrentField = null; // 存储前一次的洋流方向场
    let maxDirectionChange = Math.PI / 3; // 最大方向变化：60度
    // === 新增：宏观洋流与噪声/季节性控制全局参数 ===
    let macroCurrentGlobalInfluence = 1.0;   // 0-1 全局权重系数
    let noiseGlobalInfluence = 1.0;          // 噪声扰动全局缩放
    let seasonalCycleEnabled = true;         // 是否启用季节性 (对 getMacroCurrentVector 做轻微偏转)
    // simulationStartTime 在上方已声明, 初始化时在 startSimulation 设置
        
        // Perlin-like 简易噪声生成器 (来自drift_demo.html)
        function Noise(seed = 123) {
            const rand = mulberry32(seed);
            const grid = {}; 
            const size = 64;
            
            function key(x, y) { return x + ',' + y; }
            
            function g(x, y) { 
                const k = key(x, y); 
                if (!(k in grid)) grid[k] = rand() * 2 - 1; 
                return grid[k]; 
            }
            
            function lerp(a, b, t) { return a + (b - a) * t; }
            
            function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); } // Perlin fade
            
            this.get = (x, y) => { 
                x /= 140; y /= 140; 
                const xi = Math.floor(x), yi = Math.floor(y); 
                const xf = x - xi, yf = y - yi; 
                const tl = g(xi, yi), tr = g(xi + 1, yi), bl = g(xi, yi + 1), br = g(xi + 1, yi + 1); 
                const u = fade(xf), v = fade(yf); 
                return lerp(lerp(tl, tr, u), lerp(bl, br, u), v); 
            };
        }
        
        function mulberry32(a) {
            return function() {
                var t = a += 0x6D2B79F5; 
                t = Math.imul(t ^ t >>> 15, t | 1); 
                t ^= t + Math.imul(t ^ t >>> 7, t | 61); 
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }
        
        // 初始化全局噪声场
        function initializeGlobalNoiseField() {
            globalNoiseField = new Noise(Date.now() % 100000);
            console.log('🌊 全局随机洋流场已初始化');
        }
        
        // 随机化洋流场
        function randomizeCurrents() {
            // 存储前一次的洋流方向场
            if (globalNoiseField) {
                previousCurrentField = globalNoiseField;
            }
            
            // 创建新的噪声场
            globalNoiseField = new Noise(Math.random() * 999999 | 0);
            console.log('🔀 洋流场已随机化 (限制60度方向变化)');
            updateStatus('🔀 洋流场已重新生成 (方向连续性优化)');
        }
        
        // 辅助函数：规范化角度到 -π 到 π 范围
        function normalizeAngle(angle) {
            while (angle > Math.PI) angle -= 2 * Math.PI;
            while (angle < -Math.PI) angle += 2 * Math.PI;
            return angle;
        }
        
        // 辅助函数：计算两个角度之间的最小差异
        function getAngleDifference(angle1, angle2) {
            let diff = angle1 - angle2;
            return normalizeAngle(diff);
        }
        
        // 调整最大方向变化限制
        function setMaxDirectionChange(degrees) {
            maxDirectionChange = (degrees * Math.PI) / 180; // 转换为弧度
            document.getElementById('direction-limit').textContent = degrees + '°';
            console.log(`🧭 洋流最大方向变化设置为 ${degrees}°`);
            updateStatus(`🧭 洋流转向限制: ${degrees}°`);
        }

        // === 新增：设置宏观洋流权重 ===
        function setMacroInfluence(val){
            macroCurrentGlobalInfluence = val;
            const pct = Math.round(val*100);
            const el=document.getElementById('macro-influence-val'); if(el) el.textContent=pct+'%';

        // Leaflet地图会自动处理投影和坐标转换

        // 粒子系统
        class Particle {
            constructor(lon, lat, id, emissionPoint = null) {

            initializeVelocity() {
                // 优先使用发射点指定方向
                const emissionDirection = this.getEmissionPointDirection(this.emissionPoint);
                
                if (emissionDirection) {
                    // 使用发射点方向为主，只添加小量随机扰动
                    const emissionWeight = 0.8;   // 发射点方向权重
                    const randomWeight = 0.2;     // 随机扰动权重
                
                    // 小范围随机扰动（限制在±30度内）
                    const individualSeed = (this.id * 73 + Math.floor(this.lon * 100) * 37) % 1009;
                    const randomness = (individualSeed / 1009.0 - 0.5) * 2; // -1 到 1
                    
                    // 限制随机角度在±30度内
                    const maxRandomAngle = Math.PI / 6; // 30度
                    const randomAngle = randomness * maxRandomAngle;
                    
                    // 获取发射点基准角度
                    const baseAngle = Math.atan2(emissionDirection.vlat, emissionDirection.vlon);
                    const finalAngle = baseAngle + randomAngle;
                    
                    // 🌊 关键改进：让开始模拟时的洋流方向与粒子初速度保持一致
                    this.alignOceanCurrentWithInitialVelocity(finalAngle);
                    
                    // 基准速度大小
                    const baseSpeed = 0.5 + Math.abs(randomness) * 0.3; // 0.5-0.8
                    
                    // 设置最终速度，确保遵循发射点方向
                    this.vlon = Math.cos(finalAngle) * baseSpeed * emissionWeight + randomness * 0.1 * randomWeight;
                    this.vlat = Math.sin(finalAngle) * baseSpeed * emissionWeight + randomness * 0.1 * randomWeight;
                
                    console.log(`🎯 粒子 #${this.id} 使用发射点方向: ${emissionDirection.name}, 基准角度=${(baseAngle * 180 / Math.PI).toFixed(1)}°, 最终角度=${(finalAngle * 180 / Math.PI).toFixed(1)}°, 速度=${baseSpeed.toFixed(3)}`);
                } else {
                    // 如果没有指定发射点方向，使用默认的海洋方向

                    this.vlon = oceanDirection.vlon * 0.5;
                    this.vlat = oceanDirection.vlat * 0.5;
                    console.log(`⚠️ 粒子 #${this.id} 未找到发射点方向，使用默认海洋方向`);
                }
                
                // 确保粒子朝向海洋方向移动（保留原有的安全机制）
                this.ensureOceanDirection();
                
                // 存储个体特征用于后续更新 - 使用简化的随机种子
                const seed1 = (this.id * 31 + Math.floor(this.lon * 100)) % 1000 / 1000.0;
                const seed2 = (this.id * 47 + Math.floor(this.lat * 100)) % 1000 / 1000.0;
                const seed3 = (this.id * 59) % 1000 / 1000.0;
                
                this.individualCharacteristics = {
                    perturbationPhase: seed1 * Math.PI / 3,
                    speedMultiplier: 0.7 + seed2 * 0.6, // 0.7-1.3

                // 调试输出初始速度
                console.log(`🚀 粒子 #${this.id} 随机洋流初始速度: vlon=${this.vlon.toFixed(6)}, vlat=${this.vlat.toFixed(6)}, 个体特征: ${JSON.stringify(this.individualCharacteristics, null, 1).replace(/\n\s+/g, ' ')}`);
            }
            
            // 让开始模拟时的洋流方向与粒子初速度保持一致
            alignOceanCurrentWithInitialVelocity(targetAngle) {
                // 创建或更新粒子初始化时的洋流方向调整
                if (!this.initialOceanAlignment) {
                    this.initialOceanAlignment = {};
                }
                
                // 存储目标角度，用于在早期模拟阶段影响洋流计算
                this.initialOceanAlignment = {
                    targetAngle: targetAngle,
                    strength: 0.95,  // 初始强度为95%（保留一点洋流变化）
                    decayRate: 0.003, // 每帧衰减0.3%（更慢的衰减）
                    minStrength: 0.4, // 最小保留强度40%（更高的最小值）
                    active: true,
                    startTime: Date.now() // 记录开始时间
                };
                
                // 设置洋流协调的时效性（模拟开始60秒内有效，更长的持续时间）
                this.initialOceanAlignment.expirationTime = Date.now() + 60000; // 60秒
                
                console.log(`🌊 粒子 #${this.id} 洋流方向协调: 目标角度=${(targetAngle * 180 / Math.PI).toFixed(1)}°, 持续30秒`);
            }
            
            // 应用洋流与初始速度的协调
            applyOceanCurrentAlignment(originalCurrent) {
                // 检查是否有活跃的洋流协调设置
                if (!this.initialOceanAlignment || !this.initialOceanAlignment.active) {
                    return originalCurrent;
                }
                
                const alignment = this.initialOceanAlignment;
                
                // 检查协调是否已过期
                if (Date.now() > alignment.expirationTime) {
                    alignment.active = false;
                    console.log(`⏰ 粒子 #${this.id} 洋流协调过期，恢复正常洋流模式`);
                    return originalCurrent;
                }
                
                // 计算当前协调强度（随时间衰减）
                alignment.strength *= (1 - alignment.decayRate);
                if (alignment.strength < alignment.minStrength) {
                    alignment.strength = alignment.minStrength;
                }
                
                // 计算理想的洋流方向（与粒子初始方向一致）
                const originalSpeed = Math.sqrt(originalCurrent.u * originalCurrent.u + originalCurrent.v * originalCurrent.v);
                
                // 在开始阶段使用更强的方向一致性
                const timeSinceStart = (Date.now() - alignment.startTime) / 1000; // 秒
                const earlyBoost = timeSinceStart < 10 ? 1.2 : 1.0; // 前10秒增强20%
                
                const idealU = Math.cos(alignment.targetAngle) * originalSpeed * earlyBoost;
                const idealV = Math.sin(alignment.targetAngle) * originalSpeed * earlyBoost;
                
                // 使用更强的混合比例，确保初始方向占主导
                const effectiveStrength = Math.min(alignment.strength * earlyBoost, 0.98);
                const blendedU = originalCurrent.u * (1 - effectiveStrength) + idealU * effectiveStrength;
                const blendedV = originalCurrent.v * (1 - effectiveStrength) + idealV * effectiveStrength;
                
                // 输出协调状态（在初始阶段更频繁）
                const logChance = timeSinceStart < 10 ? 0.05 : 0.01; // 前10秒更频繁的日志
                if (Math.random() < logChance) {
                    const currentAngle = Math.atan2(blendedV, blendedU) * 180 / Math.PI;
                    const originalAngle = Math.atan2(originalCurrent.v, originalCurrent.u) * 180 / Math.PI;
                    console.log(`🌊 粒子 #${this.id} 洋流协调 [${timeSinceStart.toFixed(1)}s]: 强度=${(effectiveStrength * 100).toFixed(0)}%, 目标=${(alignment.targetAngle * 180 / Math.PI).toFixed(0)}°, 原始=${originalAngle.toFixed(0)}°, 协调后=${currentAngle.toFixed(0)}°`);
                }
                
                return { u: blendedU, v: blendedV };
            }

            ensureOceanDirection() {

                    const seed2 = ((this.id * 191 + Math.floor(this.lon * 500) * 211 + Math.floor(this.lat * 500) * 233) % 19997) / 19997;
                    const seed3 = ((this.id * 311 + Math.floor(this.lon * 200) * 347 + Math.floor(this.lat * 200) * 367) % 23003) / 23003;

            findOffshoreDirection() {
                // 为每个粒子生成个性化的方向检测
                const particleSeed = (this.id * 443 + Math.floor(this.lon * 1000) + Math.floor(this.lat * 1000)) % 8171;
                const angleOffset = (particleSeed / 8171.0) * Math.PI / 3; // 0-60°的个体化角度偏移
                
                // 生成更多随机化的检测方向 (16个方向 + 个体化偏移)
                const numDirections = 16;
                const baseDirections = [];
                
                for (let i = 0; i < numDirections; i++) {
                    const angle = (i * Math.PI * 2 / numDirections) + angleOffset;
                    const magnitude = 0.8 + (this.id % 5) * 0.1; // 0.8-1.2的方向强度变化
                    baseDirections.push({
                        vlon: Math.cos(angle) * magnitude,
                        vlat: Math.sin(angle) * magnitude,
                        angle: angle
                    });
                }
                
                // 添加一些完全随机的方向
                for (let i = 0; i < 8; i++) {
                    const randomAngle = ((this.id + i) * 97 % 1000) / 1000.0 * Math.PI / 2;
                    const randomMagnitude = 0.5 + ((this.id + i * 17) % 100) / 200.0; // 0.5-1.0
                    baseDirections.push({
                        vlon: Math.cos(randomAngle) * randomMagnitude,
                        vlat: Math.sin(randomAngle) * randomMagnitude,
                        angle: randomAngle
                    });
                }
                
                let validDirections = [];
                
                for (let dir of baseDirections) {
                    let oceanDistance = 0;
                    let hitLand = false;
                    
                    // 检查这个方向5步内的海洋距离
                    for (let step = 1; step <= 5; step++) {
                        const testLon = this.lon + dir.vlon * 0.1 * step;
                        const testLat = this.lat + dir.vlat * 0.1 * step;
                        
                        if (this.checkLandCollision(testLon, testLat)) {
                            hitLand = true;
                            break;
                        } else {
                            oceanDistance = step;
                        }
                    }
                    
                    // 收集所有有效的方向
                    if (!hitLand && oceanDistance >= 3) {
                        validDirections.push({
                            ...dir,
                            oceanDistance: oceanDistance,
                            score: oceanDistance + ((this.id * dir.angle) % 100) / 100.0 // 添加个体化评分
                        });
                    }
                }
                
                // 如果有多个有效方向，随机选择其中之一（而不是总选最优的）
                let selectedDirection = null;
                if (validDirections.length > 0) {
                    // 排序但加入随机性
                    validDirections.sort((a, b) => b.score - a.score);
                    
                    // 从前几个最佳方向中随机选择
                    const topChoices = Math.min(validDirections.length, 3 + (this.id % 4)); // 3-6个选择
                    const randomIndex = (this.id * 211 + Date.now()) % topChoices;
                    selectedDirection = validDirections[randomIndex];
                    
                    console.log(`🌊 粒子 #${this.id} 从 ${validDirections.length} 个有效方向中随机选择第 ${randomIndex + 1} 个 (得分: ${selectedDirection.score.toFixed(2)})`);
                } else {
                    // 如果没有完全安全的方向，选择一个风险较小的
                    const fallbackDirections = [
                        {vlon: 1, vlat: 0},     // 东
                        {vlon: 0.7, vlat: -0.7}, // 东南
                        {vlon: 0.7, vlat: 0.7},  // 东北
                        {vlon: 0, vlat: -1}      // 南
                    ];
                    const fallbackIndex = this.id % fallbackDirections.length;
                    selectedDirection = fallbackDirections[fallbackIndex];
                    console.log(`⚠️ 粒子 #${this.id} 使用后备方向: ${JSON.stringify(selectedDirection)}`);
                }
                
                return selectedDirection;
            }
            
            // 简化的大洋方向计算 - 基于地理位置快速判断
            getSimpleOceanDirection() {
                // 优先使用发射点的精确方向配置
                if (this.emissionPoint) {
                    const emissionDirection = this.getEmissionPointDirection(this.emissionPoint);
                    if (emissionDirection) {
                        console.log(`🧭 粒子 #${this.id} 使用发射点 ${this.emissionPoint} 的预设方向: ${JSON.stringify(emissionDirection)}`);
                        return emissionDirection;
                    }
                }
                
                // 基于粒子位置和发射点精确判断最佳海洋方向
                const lon = this.lon;
                const lat = this.lat;
                
                // 优先根据中国沿海城市的地理位置提供精确方向
                const direction = this.getRegionalOceanDirection(lon, lat);
                if (direction) return direction;
                
                // 通用海域方向（作为后备）
                // 太平洋西岸 - 向东
                if (lon >= 100 && lon <= 150 && lat >= -40 && lat <= 60) {
                    return { vlon: 1, vlat: 0.2 }; // 主要向东，略向北
                }
                
                // 默认情况 - 向最近的大洋中心
                if (Math.abs(lon) < 90) {
                    return { vlon: 1, vlat: 0 };
                } else {
                    return lon > 0 ? { vlon: -1, vlat: 0 } : { vlon: 1, vlat: 0 };
                }
            }

            // ================= 宏观洋流（副热带环流 / 赤道西向流 / 极地东风）=================
            // 返回 {u, v, speed} 单位：方向向量未归一（后续会混合噪声）
            getMacroCurrentVector(lon = this.lon, lat = this.lat) {
                // 归一化经纬度用于模式判定
                const φ = lat * Math.PI / 180;
                // 基础：低纬度赤道西向流（<8°）
                let u = 0, v = 0; // u 向东为正, v 向北为正

                // 赤道西向流（表层）
                if (Math.abs(lat) < 8) {
                    // 西向：u 负，随纬度绝对值增大衰减
                    const band = 1 - Math.pow(Math.abs(lat) / 8, 1.5);
                    u += -1.2 * band; // 更强的西向
                    // 轻微向北/南分叉：科氏力导致跨赤道偏转很弱，保持 0
                }

                // 副热带环流：以 20°~40° 之间构建顺时针(北半球)/逆时针(南半球)圆周
                // 使用经验椭圆中心：太平洋西北(160E,30N)、大西洋北( -40W,30N )、南太平洋(-110W, -30S)、南大西洋(-10W,-30S)、印度洋(80E,-25S)
                const gyres = [
                    {cx:160, cy:30, r:25, dir:1},  // 北太平洋 顺时针
                    {cx:-40, cy:30, r:22, dir:1}, // 北大西洋 顺时针
                    {cx:-110, cy:-30, r:28, dir:-1}, // 南太平洋 逆时针
                    {cx:-10, cy:-30, r:22, dir:-1}, // 南大西洋 逆时针
                    {cx:80, cy:-25, r:20, dir:-1}, // 南印度洋 逆时针
                    {cx:65, cy:25, r:18, dir:1} // 北印度洋（阿拉伯海+孟加拉湾 综合，简化）
                ];

                for (const g of gyres) {
                    // 计算到环流中心的矢量（考虑经度跨越）
                    let dx = lon - g.cx;
                    // 处理日期变更线跨越
                    if (dx > 180) dx -= 360; else if (dx < -180) dx += 360;
                    const dy = lat - g.cy;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < g.r) {
                        // 距离归一 0(中心)~1(边缘)
                        const nd = dist / g.r;
                        // 强度：边缘较强，中部弱 (抛物线)
                        const strength = Math.max(0, 1 - Math.abs(nd - 0.85)/0.85); // 边缘附近增强
                        // 切向方向：顺时针/逆时针
                        const tx = -dy * g.dir; // 旋转 90°
                        const ty = dx * g.dir;
                        const tmag = Math.sqrt(tx*tx + ty*ty) || 1;
                        u += (tx / tmag) * strength * 0.9; // 副热带环流速度系数 0.9
                        v += (ty / tmag) * strength * 0.9;
                    }
                }

                // 西风带：40°~55°，向东流，北半球、南半球对称
                if (Math.abs(lat) >= 40 && Math.abs(lat) <= 55) {
                    const westerlyFactor = 1 - (Math.abs(Math.abs(lat) - 47.5) / 7.5); // 峰值在 47.5°
                    u += 1.1 * Math.max(0, westerlyFactor);
                }

                // 极地东风：>60°，向西，较弱
                if (Math.abs(lat) >= 60 && Math.abs(lat) <= 75) {
                    const polarFactor = 1 - (Math.abs(Math.abs(lat) - 67.5) / 7.5);
                    u += -0.5 * Math.max(0, polarFactor);
                }

                // 轻微 β 规划：纬度越高，u 分量增加一点东向(除赤道西向主导区域)
                if (Math.abs(lat) > 12 && Math.abs(lat) < 35) {
                    u += 0.15 * (lat > 0 ? 1 : 1); // 简化同号
                }

                // 平滑限制最大速度防止异常叠加
                const speed = Math.sqrt(u*u + v*v);
                const maxAllowed = 1.8; // 宏观场单独最大
                if (speed > maxAllowed) {
                    const s = maxAllowed / speed;
                    u *= s; v *= s;
                }
                // === 季节性偏转 (简化：一年=120s 周期；对副热带环流叠加微小旋转) ===
                if(seasonalCycleEnabled){
                    const elapsed = (Date.now()-simulationStartTime)/1000; // s
                    const seasonPhase = (elapsed/120)%1; // 0-1
                    const angleShift = (Math.sin(seasonPhase*2*Math.PI)+Math.sin(seasonPhase*4*Math.PI)*0.3)*5 * Math.PI/180; // ±5°内
                    const speed0=Math.sqrt(u*u+v*v);
                    if(speed0>0){
                        const ang=Math.atan2(v,u)+angleShift;
                        u=Math.cos(ang)*speed0;
                        v=Math.sin(ang)*speed0;
                    }
                }
                return {u, v, speed: Math.sqrt(u*u + v*v)};
            }

            // 获取发射点坐标（用于避免朝向发射点的算法）
            getEmissionPositionCoords(emissionPoint) {
                const preciseSafePoints = {

                }

            }

            // 根据中国沿海区域提供精确的海洋方向
            getRegionalOceanDirection(lon, lat) {
                // 渤海湾区域 (天津、大连)
                if (lon >= 117 && lon <= 122 && lat >= 38 && lat <= 40) {

                if (lon >= 119 && lon <= 122 && lat >= 35 && lat <= 37) {

            // 寻找主要的大洋方向 - 指向最开阔海域
            findPrimaryOceanDirection() {
                // 定义测试方向 (更多方向以获得更精确的结果)
                const testDirections = [];
                for (let angle = 0; angle < 360; angle += 15) { // 每15度一个方向
                    const radian = (angle * Math.PI) / 180;
                    testDirections.push({
                        vlon: Math.cos(radian),
                        vlat: Math.sin(radian),
                        angle: angle
                    });
                }
                
                let bestDirection = null;
                let maxOceanDepth = 0;
                
                for (let dir of testDirections) {
                    let oceanDepth = this.calculateOceanDepth(dir);
                    
                    // 加入距离海岸的考虑
                    if (oceanDepth > maxOceanDepth) {
                        maxOceanDepth = oceanDepth;
                        bestDirection = dir;
                    }
                }
                
                if (bestDirection) {
                    console.log(`🧭 粒子 #${this.id} 选择大洋方向: ${bestDirection.angle}度 (深度评分: ${maxOceanDepth.toFixed(2)})`);
                    return {
                        vlon: bestDirection.vlon,
                        vlat: bestDirection.vlat
                    };
                } else {
                    // 回退到默认方向 (朝东，通常是开阔海域方向)
                    console.log(`🌊 粒子 #${this.id} 使用默认大洋方向 (东向)`);
                    return { vlon: 1, vlat: 0 };
                }
            }
            
            // 计算某个方向的海洋深度评分
            calculateOceanDepth(direction) {
                let totalScore = 0;
                let stepWeight = 1.0; // 远处的权重更高
                
                // 检查这个方向上多个距离点的海洋情况
                for (let step = 1; step <= 20; step++) {
                    const distance = step * 0.2; // 每步0.2度
                    const testLon = this.lon + direction.vlon * distance;
                    const testLat = this.lat + direction.vlat * distance;
                    
                    // 检查边界
                    if (testLat > 85 || testLat < -85) {
                        break; // 到达极地，停止检查
                    }
                    
                    let normalizedLon = testLon;
                    while (normalizedLon > 180) normalizedLon -= 360;
                    while (normalizedLon < -180) normalizedLon += 360;
                    
                    if (!this.isDefinitelyLand(normalizedLon, testLat)) {
                        // 是海洋，加分
                        totalScore += stepWeight;
                        stepWeight *= 1.1; // 越远的海洋权重越高
                    } else {
                        // 是陆地，重大扣分
                        totalScore -= stepWeight * 2;
                        break; // 遇到陆地就停止
                    }
                }
                
                // 加入大洋区域的特殊奖励
                const oceanBonus = this.getOceanRegionBonus(direction);
                totalScore += oceanBonus;
                
                return totalScore;
            }
            
            // 获得大洋区域奖励分数
            getOceanRegionBonus(direction) {
                const testDistance = 2.0; // 测试2度远的位置
                const testLon = this.lon + direction.vlon * testDistance;
                const testLat = this.lat + direction.vlat * testDistance;
                
                let normalizedLon = testLon;
                while (normalizedLon > 180) normalizedLon -= 360;
                while (normalizedLon < -180) normalizedLon += 360;
                
                // 检查是否指向主要海洋区域
                if (this.isInMajorOcean(normalizedLon, testLat)) {
                    return 50; // 大洋奖励
                } else if (this.isInSeaRegion(normalizedLon, testLat)) {
                    return 20; // 海域奖励
                } else {
                    return 0; // 无奖励
                }
            }
            
            // 检查是否在主要海洋中
            isInMajorOcean(lon, lat) {
                // 太平洋
                if ((lon >= 120 && lon <= 180) || (lon >= -180 && lon <= -80)) {
                    if (lat >= -60 && lat <= 60) return true;
                }
                
                // 大西洋
                if (lon >= -80 && lon <= 20) {
                    if (lat >= -60 && lat <= 70) return true;
                }
                
                // 印度洋
                if (lon >= 20 && lon <= 120) {
                    if (lat >= -60 && lat <= 30) return true;
                }
                
                return false;
            }
            
            // 检查是否在海域中 (非主要海洋但也是水域)
            isInSeaRegion(lon, lat) {
                // 地中海
                if (lon >= 5 && lon <= 40 && lat >= 30 && lat <= 45) return true;
                
                // 黑海
                if (lon >= 27 && lon <= 42 && lat >= 40 && lat <= 48) return true;
                
                // 北海
                if (lon >= -5 && lon <= 10 && lat >= 50 && lat <= 65) return true;
                
                // 日本海
                if (lon >= 127 && lon <= 142 && lat >= 33 && lat <= 52) return true;
                
                // 南海
                if (lon >= 99 && lon <= 121 && lat >= 0 && lat <= 25) return true;
                
                return false;
            }
            
            getNearestOceanCenter() {

                const centers = [

                    {lon: 113, lat: 22, name: '南海北部'},
                    {lon: 109, lat: 18, name: '南海中部'}
                ];
                
                let nearest = centers[0];
                let minDistance = Number.MAX_VALUE;
                
                for (let center of centers) {
                    const distance = Math.sqrt(
                        Math.pow(center.lon - this.lon, 2) + 
                        Math.pow(center.lat - this.lat, 2)
                    );
                    
                    if (distance < minDistance) {
                        minDistance = distance;
                        nearest = center;
                    }
                }
                
                console.log(`🎯 粒子 #${this.id} 最近海洋中心: ${nearest.name}`);
                return nearest;
            }
            
            getOceanCurrentInfluence() {
                // 根据粒子位置计算海洋环流影响
                const lon = this.lon;
                const lat = this.lat;
                
                // 北太平洋环流系统
                if (lon >= 120 && lon <= 180 && lat >= 20 && lat <= 50) {
                    const centerLon = 150;
                    const centerLat = 35;
                    const radius = Math.sqrt(Math.pow(lon - centerLon, 2) + Math.pow(lat - centerLat, 2));
                    
                    if (radius < 25) {
                        // 顺时针环流
                        const angle = Math.atan2(lat - centerLat, lon - centerLon);
                        const tangentialAngle = angle + Math.PI / 2; // 切线方向
                        const strength = (25 - radius) / 25 * 0.002; // 距离中心越近流速越强
                        
                        return {
                            vlon: Math.cos(tangentialAngle) * strength,
                            vlat: Math.sin(tangentialAngle) * strength
                        };
                    }
                }
                
                // 黑潮（Kuroshio）向北流动
                if (lon >= 120 && lon <= 145 && lat >= 25 && lat <= 45) {
                    return {
                        vlon: 0.001 + Math.random() * 0.0005,
                        vlat: 0.0015 + Math.random() * 0.001
                    };

                // 加利福尼亚海流（向南）
                if (lon >= -130 && lon <= -110 && lat >= 30 && lat <= 45) {
                    return {
                        vlon: -0.0005 + Math.random() * 0.0003,
                        vlat: -0.001 + Math.random() * 0.0005
                    };
                }
                
                // 墨西哥湾暖流
                if (lon >= -90 && lon <= -70 && lat >= 25 && lat <= 35) {
                    return {
                        vlon: 0.001 + Math.random() * 0.0008,
                        vlat: 0.0008 + Math.random() * 0.0006
                    };
                }
                
                // 默认微弱环流影响
                return {
                    vlon: (Math.random() - 0.5) * 0.0002,
