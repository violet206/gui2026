                };
            }
            
            getDistanceToLand(lon, lat) {
                // 简单的距离估算：检查周围点是否为陆地
                let oceanCount = 0;
                const checkRadius = 0.5; // 检查半径
                const steps = 8;
                
                for (let i = 0; i < steps; i++) {
                    const angle = (i / steps) * Math.PI * 2;
                    const checkLon = lon + Math.cos(angle) * checkRadius;
                    const checkLat = lat + Math.sin(angle) * checkRadius;
                    
                    if (!this.checkLandCollision(checkLon, checkLat)) {
                        oceanCount++;
                    }
                }
                
                return oceanCount; // 返回周围海洋点的数量作为距离指标
            }

            getOceanCurrent(lon, lat) {
                // 使用全局随机洋流场 (基于Perlin噪声)
                if (!globalNoiseField) {
                    console.warn('全局洋流场未初始化，使用默认洋流');
                    return { u: 0, v: 0 };
                }
                
                // 将地理坐标转换为噪声场坐标系
                const noiseX = (lon + 180) * 2; // 缩放经度 -180~180 -> 0~720
                const noiseY = (lat + 90) * 2;  // 缩放纬度 -90~90 -> 0~360
                
                // 获取噪声值 (-1 到 1)
                const noiseValue = globalNoiseField.get(noiseX, noiseY);
                
                // 计算新的洋流角度，但限制与前一次的变化
                let angle = noiseValue * Math.PI * 2; // 噪声映射到 0-2π 角度
                
                // 如果有前一次的洋流场，限制方向变化不超过90度
                if (previousCurrentField) {
                    const prevNoiseValue = previousCurrentField.get(noiseX, noiseY);
                    const prevAngle = prevNoiseValue * Math.PI * 2;
                    
                    // 计算角度差异 (使用辅助函数处理角度跨越边界)
                    const angleDiff = getAngleDifference(angle, prevAngle);
                    
                    // 限制角度变化不超过90度
                    if (Math.abs(angleDiff) > maxDirectionChange) {
                        const sign = angleDiff > 0 ? 1 : -1;
                        angle = prevAngle + sign * maxDirectionChange;
                        // 规范化调整后的角度
                        angle = normalizeAngle(angle);
                        
                        if (Math.random() < 0.01) { // 只偶尔输出日志，避免控制台过于繁忙
                            console.log(`🌊 位置(${lon.toFixed(2)}, ${lat.toFixed(2)}) 洋流方向变化限制: ${(angleDiff * 180 / Math.PI).toFixed(1)}° → ${(maxDirectionChange * 180 / Math.PI).toFixed(1)}°`);
                        }
                    }
                }
                
                const baseSpeed = 0.003 + 0.005 * Math.abs(noiseValue); // 基础速度大幅降低
                
                // 添加区域性洋流特征 (保留部分真实洋流特性)
                let regionalU = 0, regionalV = 0;
                
                // 处理跨180度经线
                let adjustedLon = lon > 180 ? lon - 360 : lon;
                
                // 赤道洋流系统增强（降低强度）
                if (Math.abs(lat) <= 20) {
                    // 北赤道流 - 向西
                    if (lat >= 5 && lat <= 20) {
                        regionalU = -0.002;
                    }
                    // 赤道逆流 - 向东
                    else if (lat >= 0 && lat <= 8) {
                        regionalU = 0.0015;
                    }
                    // 南赤道流 - 向西
                    else if (lat >= -20 && lat <= 0) {
                        regionalU = -0.003;
                    }
                }
                
                // 西风带环流增强（降低强度）
                if (lat >= -50 && lat <= -30) {
                    regionalU = 0.004; // 南极绕极流
                }
                if (lat >= 30 && lat <= 50) {
                    regionalU = 0.002; // 北半球西风带
                }
                
                // 组合噪声洋流和区域洋流
                const u = Math.cos(angle) * baseSpeed + regionalU;
                const v = Math.sin(angle) * baseSpeed + regionalV;
                
                return { u, v };
            }
            
            // 个体化洋流场采样 - 允许每个粒子有略微不同的洋流感知
            getOceanCurrentAtPosition(lon, lat) {
                // 使用标准洋流获取，但允许参数化偏移
                return this.getOceanCurrent(lon, lat);
            }
            
            // 沿岸上升流效应
            addCoastalUpwelling(lon, lat, baseU, baseV) {
                let du = 0, dv = 0;
                
                // 秘鲁-智利沿岸上升流 (强烈寒流)
                if (lon >= -85 && lon <= -70 && lat >= -20 && lat <= -5) {
                    du -= 0.1; dv += 0.2;
                }
                // 加那利上升流 (摩洛哥沿岸)
                if (lon >= -20 && lon <= -10 && lat >= 20 && lat <= 35) {
                    du -= 0.1; dv -= 0.1;
                }
                // 本格拉上升流 (纳米比亚沿岸)  
                if (lon >= 10 && lon <= 20 && lat >= -35 && lat <= -15) {
                    du += 0.1; dv += 0.2;
                }
                // 加利福尼亚上升流 (美国西海岸)
                if (lon >= -130 && lon <= -115 && lat >= 30 && lat <= 45) {
                    du -= 0.05; dv -= 0.15;
                }
                
                return { du, dv };
            }

            update(speedMultiplier = 1) {
                if (!this.isActive) return;

                // 移除生命周期限制，粒子只在碰到陆地时死亡

                // 30秒后启用严格陆地检测模式
                const simulationRuntime = (Date.now() - simulationStartTime) / 1000; // 秒
                const strictModeActive = simulationRuntime > 30; // 30秒后启用严格模式

                // 多层陆地检测系统 - 严格模式下更加严格
                // 1. 检测当前位置是否在陆地上
                if (this.isDefinitelyLand(this.lon, this.lat)) {
                    this.isActive = false;
                    this.life = 0;
                    updateStats();
                    const modeText = strictModeActive ? "[严格模式]" : "";
                    console.log(`🏝️ ${modeText} 粒子 #${this.id} 位于陆地上，立即停止 (${this.lat.toFixed(3)}°, ${this.lon.toFixed(3)}°)`);
                    return;
                }

                // 2. 在严格模式下检测下一步是否会进入陆地
                if (strictModeActive && this.checkAdvancedLandDetection(this.lon, this.lat)) {
                    this.isActive = false;
                    this.life = 0;
                    updateStats();
                    console.log(`🚨 [严格模式] 粒子 #${this.id} 前方检测到陆地，预防穿越停止 (${this.lat.toFixed(3)}°, ${this.lon.toFixed(3)}°)`);
                    return;
                }

                // 3. 检测路径上是否有陆地阻挡（使用后面计算的nextLon/nextLat）
                
                // 额外的陆地检测 - 检查粒子是否可能漂移到了陆地上但之前未检测到
                const strictLandCheck = this.isDefinitelyLand(this.lon, this.lat);
                if (strictLandCheck) {
                    this.isActive = false;
                    this.life = 0; // 清空寿命
                    updateStats();
                    const hasTrail = this.trailPolyline || (this.trailDots && this.trailDots.length > 0);
                    console.log(`🚨 粒子 #${this.id} 严格陆地检测，寿命清空（永久死亡） (${this.lat.toFixed(3)}°, ${this.lon.toFixed(3)}°) [轨迹状态: ${hasTrail ? '有轨迹' : '无轨迹'}]`);
                    return;
                }
                
                // 海岸线缓冲区检测 - 接触陆地时清空寿命
                if (this.checkLandCollision(this.lon, this.lat, true)) {
                    const coastalBeachingChance = 0.01; // 1%的概率搁浅
                    if (Math.random() < coastalBeachingChance) {
                        this.isActive = false;
                        this.life = 0; // 清空寿命
                        updateStats();
                        console.log(`🌊 粒子 #${this.id} 在海岸线缓冲区接触陆地，寿命清空 (${this.lat.toFixed(3)}°, ${this.lon.toFixed(3)}°)`);
                        return;
                    }
                }

                // 随机洋流驱动的运动更新
                let current = this.getOceanCurrent(this.lon, this.lat);
                
                // 🌊 应用洋流与初始速度的协调机制（开始模拟时生效）
                current = this.applyOceanCurrentAlignment(current);
                
                // 使用个体特征调节响应
                const characteristics = this.individualCharacteristics || {
                    speedMultiplier: 1.0,
                    perturbationPhase: 0,
                    directionBias: 0,
                    noiseScale: 1.0
                };
                
                // 动态响应系数 - 基于个体特征和时间
                const timeVar = (Date.now() - simulationStartTime) / 10000; // 时间变量
                const responseRate = 0.85 + 0.1 * Math.sin(characteristics.perturbationPhase + timeVar);
                const currentInfluence = 0.8 + 0.4 * Math.cos(characteristics.directionBias + timeVar * 0.5);
                
                // 保存旧速度方向
                const oldVlon = this.vlon;
                const oldVlat = this.vlat;
                const oldAngle = Math.atan2(oldVlat, oldVlon);
                
                // 计算新的洋流影响下的速度
                let newVlon = this.vlon * responseRate + current.u * currentInfluence * characteristics.speedMultiplier;
                let newVlat = this.vlat * responseRate + current.v * currentInfluence * characteristics.speedMultiplier;
                
                // 应用60度最大转向限制
                const newAngle = Math.atan2(newVlat, newVlon);
                let angleChange = newAngle - oldAngle;
                
                // 标准化角度差到 [-π, π] 范围
                while (angleChange > Math.PI) angleChange -= 2 * Math.PI;
                while (angleChange < -Math.PI) angleChange += 2 * Math.PI;
                
                const maxTurnAngle = Math.PI / 3; // 60度
                if (Math.abs(angleChange) > maxTurnAngle) {
                    // 限制转向角度
                    const limitedAngle = oldAngle + Math.sign(angleChange) * maxTurnAngle;
                    const speed = Math.sqrt(newVlon * newVlon + newVlat * newVlat);
                    newVlon = Math.cos(limitedAngle) * speed;
                    newVlat = Math.sin(limitedAngle) * speed;
                    
                    console.log(`🔄 粒子 #${this.id} 转向限制: ${(angleChange * 180 / Math.PI).toFixed(1)}° -> ${(maxTurnAngle * Math.sign(angleChange) * 180 / Math.PI).toFixed(1)}°`);
                }
                
                // 检查是否朝向发射点，如果是则调整方向
                if (this.emissionPoint) {
                    const emissionPos = this.getEmissionPositionCoords(this.emissionPoint);
                    if (emissionPos) {
                        const toEmissionLon = emissionPos.lon - this.lon;
                        const toEmissionLat = emissionPos.lat - this.lat;
                        const toEmissionAngle = Math.atan2(toEmissionLat, toEmissionLon);
                        
                        let velocityAngle = Math.atan2(newVlat, newVlon);
                        let angleDiff = velocityAngle - toEmissionAngle;
                        
                        // 标准化角度差
                        while (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;
                        while (angleDiff < -Math.PI) angleDiff += 2 * Math.PI;
                        
                        // 如果粒子朝向发射点（角度差小于90度），调整方向
                        if (Math.abs(angleDiff) < Math.PI / 2) {
                            // 调整到垂直于朝向发射点的方向
                            const adjustedAngle = toEmissionAngle + (angleDiff > 0 ? Math.PI / 2 : -Math.PI / 2);
                            const speed = Math.sqrt(newVlon * newVlon + newVlat * newVlat);
                            newVlon = Math.cos(adjustedAngle) * speed;
                            newVlat = Math.sin(adjustedAngle) * speed;
                            
                            console.log(`🚫 粒子 #${this.id} 避免朝向发射点 ${this.emissionPoint}: 调整方向 ${(angleDiff * 180 / Math.PI).toFixed(1)}°`);
                        }
                    }
                }
                
                // 应用计算后的速度 - 最终角度检查
                const currentAngle = Math.atan2(this.vlat, this.vlon);
                const targetAngle = Math.atan2(newVlat, newVlon);
                const finalAngleDiff = targetAngle - currentAngle;
                
                // 确保角度变化不超过60度限制
                let finalAngle = targetAngle;
                if (Math.abs(finalAngleDiff) > maxDirectionChange) {
                    finalAngle = currentAngle + Math.sign(finalAngleDiff) * maxDirectionChange;
                    console.log(`🧭 粒子 #${this.id} 角度变化被限制: ${(finalAngleDiff * 180 / Math.PI).toFixed(1)}° → ${(maxDirectionChange * 180 / Math.PI).toFixed(1)}°`);
                }
                
                // 保持速度大小，只调整方向
                const speed = Math.sqrt(newVlon * newVlon + newVlat * newVlat);
                this.vlon = Math.cos(finalAngle) * speed;
                this.vlat = Math.sin(finalAngle) * speed;
                
                // 保存当前角度用于最终检查
                const previousAngle = Math.atan2(this.vlat, this.vlon);
                
                // 增强的个体化持续扰动系统
                const perturbationTimeVar = (Date.now() - simulationStartTime) / 1000;
                
                if (this.individualCharacteristics) {
                    const char = this.individualCharacteristics;
                    
                    // 多频率叠加的个体化扰动
                    const freq1 = 0.1 + (this.id % 7) * 0.02; // 0.1-0.22Hz 主频
                    const freq2 = 0.05 + (this.id % 11) * 0.01; // 0.05-0.15Hz 低频
                    const freq3 = 0.3 + (this.id % 13) * 0.03; // 0.3-0.66Hz 高频
                    
                    const perturbation1 = Math.sin(char.perturbationPhase + perturbationTimeVar * freq1 * Math.PI * 2);
                    const perturbation2 = Math.cos(char.directionBias + perturbationTimeVar * freq2 * Math.PI * 2);
                    const perturbation3 = Math.sin(perturbationTimeVar * freq3 * Math.PI * 2 + this.id);
                    
                    // 组合扰动强度
                    const combinedPerturbation = (perturbation1 * 0.5 + perturbation2 * 0.3 + perturbation3 * 0.2) * 0.0001 * noiseGlobalInfluence;
                    
                    // 个体化方向偏移
                    const directionOffset = char.directionBias + perturbation1 * 0.2;
                    this.vlon += combinedPerturbation * Math.cos(directionOffset) * char.speedMultiplier;
                    this.vlat += combinedPerturbation * Math.sin(directionOffset) * char.speedMultiplier;
                    
                    // 个体化噪声场采样 - 每个粒子看到稍微不同的洋流场
                    const offsetNoiseLon = this.lon + char.noiseScale * 0.1;
                    const offsetNoiseLat = this.lat + char.noiseScale * 0.1;
                    const individualCurrent = this.getOceanCurrentAtPosition(offsetNoiseLon, offsetNoiseLat);
                    
                    // 应用个体化洋流影响
                    const individualInfluence = 0.1 * char.speedMultiplier;
                    this.vlon += individualCurrent.u * individualInfluence;
                    this.vlat += individualCurrent.v * individualInfluence;
                }
                
                // 最终全局角度检查 - 确保不超过60度变化
                const currentAngleAfterUpdate = Math.atan2(this.vlat, this.vlon);
                let angleDiffFinal = currentAngleAfterUpdate - previousAngle;
                
                // 处理角度跨越±π的情况
                while (angleDiffFinal > Math.PI) angleDiffFinal -= 2 * Math.PI;
                while (angleDiffFinal < -Math.PI) angleDiffFinal += 2 * Math.PI;
                
                if (Math.abs(angleDiffFinal) > maxDirectionChange) {
                    // 如果角度变化超过60度，强制限制
                    const limitedAngle = previousAngle + Math.sign(angleDiffFinal) * maxDirectionChange;
                    const currentSpeed = Math.sqrt(this.vlon * this.vlon + this.vlat * this.vlat);
                    
                    this.vlon = Math.cos(limitedAngle) * currentSpeed;
                    this.vlat = Math.sin(limitedAngle) * currentSpeed;
                    
                    console.log(`⚠️ 粒子 #${this.id} 最终角度限制: ${(angleDiffFinal * 180 / Math.PI).toFixed(1)}° → ${(maxDirectionChange * 180 / Math.PI).toFixed(1)}°`);
                }
                
                // 记录漂移趋势前的角度用于最终检查
                const beforeTrendAngle = Math.atan2(this.vlat, this.vlon);
                
                // 基于ID的受限漂移趋势 - 限制在小角度内
                const baseDirection = this.getSimpleOceanDirection();
                const baseAngle = Math.atan2(baseDirection.vlat, baseDirection.vlon);
                const driftTrend = baseAngle + ((this.id * 17) % 60 - 30) * Math.PI / 180; // 减小到±30度范围
                const trendStrength = 0.00002 + (this.id % 3) * 0.00001; // 减小强度 0.00002-0.00004
                
                this.vlon += Math.cos(driftTrend) * trendStrength;
                this.vlat += Math.sin(driftTrend) * trendStrength;
                
                // ================= 叠加宏观环流向量 =================
                const macro = this.getMacroCurrentVector();
                if (macro.speed > 0) {
                    // 与当前速度长度相关的混合比例（保持局部扰动存在）
                    const localSpeed = Math.sqrt(this.vlon*this.vlon + this.vlat*this.vlat) || 1;
                    // 根据纬度与是否在环流内部调整影响力：热带/副热带更强，高纬稍弱
                    const latAbs = Math.abs(this.lat);
                    let influence = 0.35; // 基础 35%
                    if (latAbs < 12) influence = 0.45; // 赤道西向流主导
                    else if (latAbs > 45 && latAbs < 60) influence = 0.30; // 西风带适中
                    else if (latAbs >= 60) influence = 0.22; // 极地减弱
                    // 如果当前速度很低，加大宏观流推动
                    if (localSpeed < 0.05) influence += 0.15;
                    // 粒子个体差异小幅扰动
                    influence *= (0.9 + ((this.id * 13) % 17) / 100);
                    // 叠加全局权重调节
                    influence *= macroCurrentGlobalInfluence;
                    
                    // 速度混合：v_new = (1-influence)*v_local + influence*macro_norm*localSpeedScale
                    const macroMag = Math.sqrt(macro.u*macro.u + macro.v*macro.v) || 1;
                    // 控制宏观流强度映射到局部（避免瞬间跳变）：目标速度 = 0.6*local + 0.4*macroMag
                    const targetSpeed = localSpeed * 0.6 + macroMag * 0.4;
                    const macroUnitU = macro.u / macroMag;
                    const macroUnitV = macro.v / macroMag;
                    const blendedU = this.vlon * (1 - influence) + macroUnitU * targetSpeed * influence;
                    const blendedV = this.vlat * (1 - influence) + macroUnitV * targetSpeed * influence;
                    
                    // 单步再做一次最大转向裁剪，避免宏观流导致大角度跳变
                    const beforeBlendAngle = Math.atan2(this.vlat, this.vlon);
                    const afterBlendAngle = Math.atan2(blendedV, blendedU);
                    let diffAngle = normalizeAngle(afterBlendAngle - beforeBlendAngle);
                    const maxTurnBlend = maxDirectionChange || (Math.PI/3);
                    let finalBlendU = blendedU, finalBlendV = blendedV;
                    if (Math.abs(diffAngle) > maxTurnBlend) {
                        const speedBlend = Math.sqrt(blendedU*blendedU + blendedV*blendedV) || 1e-6;
                        const limitedAngle = beforeBlendAngle + Math.sign(diffAngle) * maxTurnBlend;
                        finalBlendU = Math.cos(limitedAngle) * speedBlend;
                        finalBlendV = Math.sin(limitedAngle) * speedBlend;
                        console.log(`🌐 粒子 #${this.id} 宏观流转向裁剪 ${(diffAngle*180/Math.PI).toFixed(1)}° → ${(maxTurnBlend*180/Math.PI).toFixed(1)}°`);
                    }
                    this.vlon = finalBlendU;
                    this.vlat = finalBlendV;
                }
                
                // 漂移趋势后的最终角度检查
                const afterTrendAngle = Math.atan2(this.vlat, this.vlon);
                let trendAngleDiff = afterTrendAngle - beforeTrendAngle;
                
                // 处理角度跨越±π的情况
                while (trendAngleDiff > Math.PI) trendAngleDiff -= 2 * Math.PI;
                while (trendAngleDiff < -Math.PI) trendAngleDiff += 2 * Math.PI;
                
                if (Math.abs(trendAngleDiff) > Math.PI / 6) { // 30度限制
                    // 如果漂移趋势导致过大角度变化，撤销
                    this.vlon -= Math.cos(driftTrend) * trendStrength;
                    this.vlat -= Math.sin(driftTrend) * trendStrength;
                }
                
                // 速度异常检测和自动修正
                const currentSpeed = Math.sqrt(this.vlon * this.vlon + this.vlat * this.vlat);
                const maxReasonableSpeed = 0.05; // 最大合理速度
                const minReasonableSpeed = 0.00001; // 最小合理速度
                
                // 检测异常高速
                if (currentSpeed > maxReasonableSpeed) {
                    const reductionFactor = maxReasonableSpeed / currentSpeed;
                    this.vlon *= reductionFactor;
                    this.vlat *= reductionFactor;
                    console.warn(`🚨 粒子 #${this.id} 速度过快已修正: ${currentSpeed.toFixed(6)} -> ${(currentSpeed * reductionFactor).toFixed(6)}`);
                }
                
                // 检测异常低速或静止
                if (currentSpeed < minReasonableSpeed) {
                    // 给予基于发射点方向的受限随机速度
                    const baseDirection = this.getSimpleOceanDirection();
                    const baseAngle = Math.atan2(baseDirection.vlat, baseDirection.vlon);
                    const emergencyAngle = baseAngle + (Math.random() - 0.5) * Math.PI / 3;
                    const emergencySpeed = minReasonableSpeed * 2;
                    this.vlon = Math.cos(emergencyAngle) * emergencySpeed;
                    this.vlat = Math.sin(emergencyAngle) * emergencySpeed;
                    console.log(`🔄 粒子 #${this.id} 速度过低已重置: ${currentSpeed.toFixed(8)} -> ${emergencySpeed.toFixed(6)}`);
                }
                
                // 周期性方向微调 - 每个粒子都有独特的变化模式
                const updateCount = this.updateCount || 0;
                this.updateCount = updateCount + 1;
                
                if (updateCount % (5 + this.id % 10) === 0) { // 每5-14次更新进行一次微调
                    const adjustmentStrength = 0.00001 + (this.id % 37) * 0.000005;
                    // 受限的微调角度 - 严格限制在±10度内的小幅调整
                    const currentAngle = Math.atan2(this.vlat, this.vlon);
                    const maxMicroAdjustment = Math.PI / 18; // ±10度限制
                    const microAdjustment = ((this.id * 7 + updateCount) % 20 - 10) * Math.PI / 180; // ±10度
                    const limitedAdjustment = Math.max(-maxMicroAdjustment, Math.min(maxMicroAdjustment, microAdjustment));
                    const adjustmentAngle = currentAngle + limitedAdjustment;
                    
                    this.vlon += Math.cos(adjustmentAngle) * adjustmentStrength;
                    this.vlat += Math.sin(adjustmentAngle) * adjustmentStrength;
                }

                // 保存旧位置与旧方向（用于单步转向限制）
                const oldLon = this.lon;
                const oldLat = this.lat;
                const prevAngleForStep = Math.atan2(this.vlat, this.vlon);
                
                // 近岸减速机制 - 检查到海岸的距离并调整速度
                const coastDistance = this.getDistanceToCoast(this.lon, this.lat);
                let coastalSpeedFactor = 1.0;
                
                if (coastDistance !== null && coastDistance < 0.5) {
                    // 距离海岸越近，速度越慢
                    coastalSpeedFactor = Math.max(0.3, coastDistance / 0.5); // 最慢30%速度
                    
                    // 根据潮汐调整：低潮时进一步减速
                    const tidalFactor = 0.5 + 0.5 * Math.sin(tidalCycle * 2 * Math.PI);
                    coastalSpeedFactor *= (0.7 + 0.3 * tidalFactor); // 低潮时额外减速
                }
                
                // 应用海岸减速因子
                const adjustedSpeedMultiplier = speedMultiplier * coastalSpeedFactor;
                
                // 预测下一步位置
                let nextLon = this.lon + this.vlon * adjustedSpeedMultiplier;
                let nextLat = this.lat + this.vlat * adjustedSpeedMultiplier;

                // 处理经度边界 (-180 到 180)
                if (nextLon > 180) nextLon -= 360;
                if (nextLon < -180) nextLon += 360;
                
                // 处理纬度边界 (-90 到 90)
                if (nextLat > 90 || nextLat < -90) {
                    this.isActive = false;
                    return;
                }

                // 改进路径陆地检测: 自适应多采样 + 二分缩步 + 沿岸滑移
                if (this.checkPathForLandAdaptive(this.lon, this.lat, nextLon, nextLat)) {
                    let low=0, high=1, safeLon=this.lon, safeLat=this.lat;
                    for(let i=0;i<6;i++){
                        const mid=(low+high)/2;
                        const tLon=this.lon + (nextLon-this.lon)*mid;
                        const tLat=this.lat + (nextLat-this.lat)*mid;
                        if(this.checkPathForLandStrict(this.lon,this.lat,tLon,tLat) || this.isDefinitelyLand(tLon,tLat)){
                            high=mid;
                        } else { low=mid; safeLon=tLon; safeLat=tLat; }
                    }
                    if(low < 0.02){
                        // 尝试沿岸滑移
                        const dLon=nextLon-this.lon, dLat=nextLat-this.lat;
                        const mag=Math.sqrt(dLon*dLon+dLat*dLat)||1;
                        const normals=[{lon:-dLat/mag, lat:dLon/mag},{lon:dLat/mag, lat:-dLon/mag}];
                        let slipped=false; const slipDist=0.05*adjustedSpeedMultiplier;
                        for(const n of normals){
                            const sLon=this.lon + n.lon*slipDist; const sLat=this.lat + n.lat*slipDist;
                            if(!this.checkPathForLandStrict(this.lon,this.lat,sLon,sLat) && !this.isDefinitelyLand(sLon,sLat)){
                                safeLon=sLon; safeLat=sLat; slipped=true; console.log(`🧭 粒子 #${this.id} 沿岸滑移`); break;
                            }
                        }
                        if(!slipped){
                            this.isActive=false; updateStats();
                            console.log(`🛑 粒子 #${this.id} 被陆地完全阻挡判定搁浅 (${this.lat.toFixed(3)}°, ${this.lon.toFixed(3)}°)`);
                            return;
                        }
                    } else {
                        console.log(`🪨 粒子 #${this.id} 前进被截断, 仅使用 ${(low*100).toFixed(1)}% 步长`);
                    }
                    nextLon=safeLon; nextLat=safeLat;
                }
                
                // 检测目标位置是否为陆地
                if (this.isDefinitelyLand(nextLon, nextLat)) {
                    this.isActive = false;
                    updateStats();
                    console.log(`�️ 粒子 #${this.id} 目标位置为陆地，停止移动 (${nextLat.toFixed(3)}°, ${nextLon.toFixed(3)}°)`);
                    return;
                }
                
                // 单步方向转向限制 (≤60°)
                const stepDX = nextLon - this.lon;
                const stepDY = nextLat - this.lat;
                const stepMag = Math.sqrt(stepDX*stepDX + stepDY*stepDY);
                if(stepMag>0){
                    let stepAngle = Math.atan2(stepDY, stepDX);
                    let diff = normalizeAngle(stepAngle - prevAngleForStep);
                    const maxTurn = maxDirectionChange || (Math.PI/3);
                    if(Math.abs(diff) > maxTurn){
                        stepAngle = prevAngleForStep + Math.sign(diff)*maxTurn;
                        nextLon = this.lon + Math.cos(stepAngle)*stepMag;
                        nextLat = this.lat + Math.sin(stepAngle)*stepMag;
                        const vmag=Math.sqrt(this.vlon*this.vlon+this.vlat*this.vlat)||1e-6;
                        this.vlon = Math.cos(stepAngle)*vmag;
                        this.vlat = Math.sin(stepAngle)*vmag;
                        console.log(`↩️ 粒子 #${this.id} 单步转向裁剪 ${(diff*180/Math.PI).toFixed(1)}° → ${(maxTurn*180/Math.PI).toFixed(1)}°`);
                    }
                }

                // 应用位置更新
                this.lon = nextLon; this.lat = nextLat;

                // 移动后立即检测是否到达陆地 - 最终防护
                if (this.isDefinitelyLand(this.lon, this.lat)) {
                    this.isActive = false;
                    updateStats();
                    console.log(`🚨 粒子 #${this.id} 移动后检测到陆地，立即停止 (${this.lat.toFixed(3)}°, ${this.lon.toFixed(3)}°)`);
                    return;
                }

                // 优化的陆地搁浅检测 - 包含渐进搁浅和反弹机制
                const strandingResult = this.checkAdvancedStranding(this.lon, this.lat);
                if (strandingResult.shouldStrand) {
                    if (strandingResult.canReflect && Math.random() < strandingResult.reflectProbability) {
                        // 反弹机制 - 粒子从浅水区反弹回深水
                        this.lon = strandingResult.reflectedPosition.lon;
                        this.lat = strandingResult.reflectedPosition.lat;
                        this.vlon *= -0.7; // 反弹后速度减弱
                        this.vlat *= -0.7;
                        console.log(`🌊 粒子 #${this.id} 浅水反弹到 (${this.lat.toFixed(3)}°, ${this.lon.toFixed(3)}°)`);
                    } else {
                        // 确实搁浅
                        this.isActive = false;
                        updateStats();
                        const hasTrail = this.trailPolyline || (this.trailDots && this.trailDots.length > 0);
                        const strandType = strandingResult.strandType || '陆地碰撞';
                        console.log(`🏖️ 粒子 #${this.id} ${strandType}搁浅 (${this.lat.toFixed(3)}°, ${this.lon.toFixed(3)}°) [轨迹: ${hasTrail ? '有' : '无'}] [潮汐: ${(tidalCycle * 100).toFixed(1)}%]`);
                        return;
                    }
                }

                // 增强的轨迹连续性保护和异常运动检测
                const currentTime = Date.now();
                const timeElapsed = (currentTime - (this.lastPositionTime || currentTime)) / 1000;
                this.lastPositionTime = currentTime;
                
                // 多层异常运动检测系统
                if (this.trail.length > 0) {
                    const lastPos = this.trail[this.trail.length - 1];
                    const moveDistance = Math.sqrt(
                        Math.pow(this.lon - lastPos.lon, 2) + 
                        Math.pow(this.lat - lastPos.lat, 2)
                    );
                    
                    // 1. 瞬时速度异常检测
                    const maxInstantSpeed = 0.05; // 降低最大瞬时速度限制
                    if (moveDistance > maxInstantSpeed) {
                        console.warn(`🚨 粒子 #${this.id} 瞬时速度异常: ${moveDistance.toFixed(6)}°/步 > ${maxInstantSpeed}`);
                        
                        // 渐进式位置修正 - 不是直接拉回
                        const correctionRatio = maxInstantSpeed / moveDistance * 0.8;
                        this.lon = lastPos.lon + (this.lon - lastPos.lon) * correctionRatio;
                        this.lat = lastPos.lat + (this.lat - lastPos.lat) * correctionRatio;
                        
                        // 速度渐减而非突然清零
                        this.vlon *= 0.5;
                        this.vlat *= 0.5;
                        
                        console.log(`🔧 粒子 #${this.id} 位置渐进修正, 速度渐减`);
                    }
                    
                    // 2. 累积速度趋势检测（检查最近5个点）
                    if (this.trail.length >= 5) {
                        const recentPoints = this.trail.slice(-5);
                        let totalDistance = 0;
                        for (let i = 1; i < recentPoints.length; i++) {
                            const d = Math.sqrt(
                                Math.pow(recentPoints[i].lon - recentPoints[i-1].lon, 2) + 
                                Math.pow(recentPoints[i].lat - recentPoints[i-1].lat, 2)
                            );
                            totalDistance += d;
                        }
                        
                        const avgSpeedRecent = totalDistance / 4; // 4个步长
                        const maxAvgSpeed = 0.02; // 平均速度限制
                        
                        if (avgSpeedRecent > maxAvgSpeed) {
                            console.warn(`⚠️ 粒子 #${this.id} 平均速度异常: ${avgSpeedRecent.toFixed(6)}°/步 > ${maxAvgSpeed}`);
                            
                            // 基于噪声场的速度重新校准
                            const correctedCurrent = this.getOceanCurrent(this.lon, this.lat);
                            const speedScale = maxAvgSpeed / avgSpeedRecent * 0.6;
                            
                            this.vlon = correctedCurrent.u * 1.5 + this.vlon * speedScale;
                            this.vlat = correctedCurrent.v * 1.5 + this.vlat * speedScale;
                            
                            console.log(`🔄 粒子 #${this.id} 速度重新校准到洋流场`);
                        }
                    }
                    
                    // 3. 方向突变检测（防止急转弯横冲直撞）
                    if (this.trail.length >= 3) {
                        const p1 = this.trail[this.trail.length - 3];
                        const p2 = this.trail[this.trail.length - 2];
                        const p3 = this.trail[this.trail.length - 1];
                        
                        // 计算前后两段的方向角
                        const angle1 = Math.atan2(p2.lat - p1.lat, p2.lon - p1.lon);
                        const angle2 = Math.atan2(p3.lat - p2.lat, p3.lon - p2.lon);
                        let angleDiff = Math.abs(angle2 - angle1);
                        if (angleDiff > Math.PI) angleDiff = 2 * Math.PI - angleDiff; // 处理角度跨越问题
                        
                        const maxAngleChange = maxDirectionChange || (Math.PI/3);
                        if (angleDiff > maxAngleChange && moveDistance > 0.005) {
                            console.warn(`🌀 粒子 #${this.id} 方向突变: ${(angleDiff * 180 / Math.PI).toFixed(1)}° > ${(maxAngleChange * 180 / Math.PI).toFixed(1)}° (裁剪)`);
                            
                            // 平滑方向过渡
                            const smoothedAngle = angle1 + (angle2 - angle1) * 0.3; // 30%的方向变化
                            const currentSpeed = Math.sqrt(this.vlon * this.vlon + this.vlat * this.vlat);
                            
                            this.vlon = Math.cos(smoothedAngle) * currentSpeed * 0.8;
                            this.vlat = Math.sin(smoothedAngle) * currentSpeed * 0.8;
                            
                            console.log(`🔄 粒子 #${this.id} 方向平滑过渡`);
                        }
                    }
                    
                    // 4. 轨迹离散度检测（防止轨迹点过于分散）
                    if (this.trail.length >= 10) {
                        const recent10 = this.trail.slice(-10);
                        const centroidLon = recent10.reduce((sum, p) => sum + p.lon, 0) / 10;
                        const centroidLat = recent10.reduce((sum, p) => sum + p.lat, 0) / 10;
                        
                        let maxDistance = 0;
                        for (let point of recent10) {
                            const distance = Math.sqrt(
                                Math.pow(point.lon - centroidLon, 2) + 
                                Math.pow(point.lat - centroidLat, 2)
                            );
                            maxDistance = Math.max(maxDistance, distance);
                        }
                        
                        const maxScatter = 0.2; // 最大散布半径
                        if (maxDistance > maxScatter) {
                            console.warn(`📊 粒子 #${this.id} 轨迹过度分散: ${maxDistance.toFixed(4)}° > ${maxScatter}°`);
                            
                            // 向质心收敛
                            const convergenceFactor = 0.1;
                            this.vlon += (centroidLon - this.lon) * convergenceFactor;
                            this.vlat += (centroidLat - this.lat) * convergenceFactor;
                            
                            console.log(`🎯 粒子 #${this.id} 向轨迹质心收敛`);
                        }
                    }
                }
                
                // 记录轨迹 - 更敏感的位置变化检测
                const positionChanged = this.trail.length === 0 || 
                    Math.abs(this.lon - this.trail[this.trail.length - 1].lon) > 0.00005 || // 进一步降低阈值
                    Math.abs(this.lat - this.trail[this.trail.length - 1].lat) > 0.00005;
                
                if (positionChanged) {
                    // 轨迹连续性检查
                    if (this.trail.length > 0) {
                        const lastPos = this.trail[this.trail.length - 1];
                        const gapDistance = Math.sqrt(
                            Math.pow(this.lon - lastPos.lon, 2) + 
                            Math.pow(this.lat - lastPos.lat, 2)
                        );
                        
                        // 如果间距过大，插入中间点保持连续性
                        if (gapDistance > 0.01) { // 降低到0.01度的间距
                            const steps = Math.ceil(gapDistance / 0.005); // 每0.005度插入一个点
                            for (let i = 1; i < steps; i++) {
                                const t = i / steps;
                                const interpLon = lastPos.lon + (this.lon - lastPos.lon) * t;
                                const interpLat = lastPos.lat + (this.lat - lastPos.lat) * t;
                                
                                this.trail.push({
                                    lon: interpLon,
                                    lat: interpLat,
                                    time: lastPos.time + (Date.now() - lastPos.time) * t,
                                    day: Math.floor((Date.now() - simulationStartTime) / 2000),
                                    interpolated: true // 标记为插值点
                                });
                            }
                            console.log(`🔗 粒子 #${this.id} 插入 ${steps-1} 个连续性点，间距: ${gapDistance.toFixed(4)}°`);
                        }
                    }
                    
                    // 优化轨迹记录频率（应用简化海洋漂流算法）
                    this.trailCounter++;
                    if (this.trailCounter % 2 === 0) { // 更频繁记录轨迹点，每2次更新记录一次
                        this.trail.push({ 
                            lon: this.lon, 
                            lat: this.lat, 
                            time: Date.now(),
                            day: Math.floor((Date.now() - simulationStartTime) / 2000) // 计算天数
                        });
                    }
                    
                    // 立即更新轨迹显示
                    this.updateTrailDisplay();
                    
                    // 调试日志 - 记录轨迹添加 (只对前3个粒子)
                    if (this.id < 3 && (this.trail.length <= 5 || this.trail.length % 20 === 0)) {
                        console.log(`🔵 粒子 #${this.id} 轨迹记录: 第${this.trail.length}个点 (${this.lat.toFixed(4)}°, ${this.lon.toFixed(4)}°)`);
                    }
                    
                    // 取消轨迹长度限制，让轨迹无限长
                    // 不再限制轨迹长度，保留完整的漂流历史
                }

                // 计算移动距离 (粗略估算)
                const deltaLon = this.lon - oldLon;
                const deltaLat = this.lat - oldLat;
                const stepDistance = Math.sqrt(deltaLon * deltaLon + deltaLat * deltaLat);
                this.distanceTraveled += stepDistance * 111; // 转换为公里
                
                // 平衡的搁浅检测机制 - 避免过早搁浅
                const beachingCheckTime = Date.now();
                const elapsedTime = (beachingCheckTime - simulationStartTime) / 1000; // 总运行时间（秒）
                
                // 只在粒子运行足够时间后才开始检测
                if (elapsedTime < 15) { // 前15秒不进行搁浅检测，让粒子自由运动
                    return;
                }
                
                // 1. 移动停滞检测 - 更宽松的阈值
                if (stepDistance < 0.00005) { // 极小移动阈值
                    this.stuckCounter++;
                    if (this.stuckCounter >= 25) { // 增加到25次才触发搁浅
                        this.isActive = false;
                        updateStats();
                        console.log(`⚓ 粒子 #${this.id} 因长期移动停滞而搁浅 (${this.lat.toFixed(3)}°, ${this.lon.toFixed(3)}°)`);
                        return;
                    }
                } else {
                    this.stuckCounter = Math.max(0, this.stuckCounter - 1); // 有移动时逐渐减少计数器
                }
                
                // 2. 长时间位置检查 - 延长检查间隔
                if (beachingCheckTime - this.lastMoveTime > 60000) { // 增加到60秒
                    const totalMove = Math.abs(this.lon - this.stuckCheckPosition.lon) + 
                                     Math.abs(this.lat - this.stuckCheckPosition.lat);
                    if (totalMove < 0.003) { // 降低移动要求
                        this.isActive = false;
                        updateStats();
                        console.log(`🕐 粒子 #${this.id} 因长时间范围内移动过小而搁浅`);
                        return;
                    }
                    // 重置检查点
                    this.lastMoveTime = beachingCheckTime;
                    this.stuckCheckPosition = {lon: this.lon, lat: this.lat};
                }
                
                // 3. 海岸线接近检测 - 降低搁浅概率
                const coastalProximity = this.getCoastalProximity(this.lon, this.lat);
                if (coastalProximity > 0.85) { // 提高接近度阈值
                    const beachingChance = (coastalProximity - 0.85) * 0.1 + elapsedTime * 0.00005; // 降低概率
                    if (Math.random() < beachingChance) {
                        this.isActive = false;
                        updateStats();
                        console.log(`🏖️ 粒子 #${this.id} 因极度接近海岸线而搁浅 (接近度: ${(coastalProximity * 100).toFixed(1)}%)`);
                        return;
                    }
                }
                
                // 4. 速度过低搁浅检测 - 更宽松
                const beachingSpeed = Math.sqrt(this.vlon * this.vlon + this.vlat * this.vlat);
                if (beachingSpeed < 0.00003) { // 降低速度阈值
                    this.lowSpeedCounter = (this.lowSpeedCounter || 0) + 1;
                    if (this.lowSpeedCounter >= 40) { // 增加到40次
                        this.isActive = false;
                        updateStats();
                        console.log(`🐌 粒子 #${this.id} 因持续极低速度而搁浅 (速度: ${beachingSpeed.toFixed(8)})`);
                        return;
                    }
                } else {
                    this.lowSpeedCounter = Math.max(0, (this.lowSpeedCounter || 0) - 2); // 有速度时快速恢复
                }
                
                // 5. 超时强制搁浅 - 大幅延长时间
                if (elapsedTime > 1800) { // 30分钟后开始概率性搁浅
                    const timeoutBeachingChance = (elapsedTime - 1800) * 0.00001; // 非常低的概率
                    if (Math.random() < timeoutBeachingChance) {
                        this.isActive = false;
                        updateStats();
                        console.log(`⏰ 粒子 #${this.id} 因超长时间运行而搁浅 (运行时间: ${Math.floor(elapsedTime)}秒)`);
                        return;
                    }
                }
                
                // 6. 移除过于严格的轨迹长度检测
                // 让粒子有更多时间自然发展轨迹
            }
            
            // 高级陆地检测 - 多步预测
            checkAdvancedLandDetection(lon, lat) {
                // 检查前方多个步长是否有陆地
                const futureSteps = 5;
                const stepSize = 0.01; // 更小的步长，更精确检测
                
                for (let step = 1; step <= futureSteps; step++) {
                    const checkLon = lon + this.vlon * stepSize * step;
                    const checkLat = lat + this.vlat * stepSize * step;
                    
                    // 边界检查
                    if (checkLat < -90 || checkLat > 90) return true;
                    
                    // 规范化经度
                    let normLon = checkLon;
                    while (normLon > 180) normLon -= 360;
                    while (normLon < -180) normLon += 360;
                    
                    // 检测陆地
                    if (this.isDefinitelyLand(normLon, checkLat)) {
                        console.log(`⚠️ 粒子 #${this.id} 前方第${step}步检测到陆地 (${checkLat.toFixed(4)}°, ${normLon.toFixed(4)}°)`);
                        return true;
                    }
                }
                
                return false;
            }
            
            // 严格的路径陆地检测
            checkPathForLandStrict(fromLon, fromLat, toLon, toLat) {
                // 更密集的路径检测
                const steps = Math.max(10, Math.ceil(Math.abs(toLon - fromLon) / 0.005 + Math.abs(toLat - fromLat) / 0.005));
                
                for (let i = 0; i <= steps; i++) {
                    const t = i / steps;
                    const checkLon = fromLon + (toLon - fromLon) * t;
                    const checkLat = fromLat + (toLat - fromLat) * t;
                    
                    // 规范化经度
                    let normLon = checkLon;
                    while (normLon > 180) normLon -= 360;
                    while (normLon < -180) normLon += 360;
                    
                    if (this.isDefinitelyLand(normLon, checkLat)) {
                        console.log(`🛑 粒子 #${this.id} 路径第${i}步检测到陆地 (${checkLat.toFixed(4)}°, ${normLon.toFixed(4)}°)`);
                        return true;
                    }
                }
                
                return false;
            }

            // 自适应路径陆地检测（增强版）
            // 组合：基础严格采样 + 额外垂直偏移采样 + 动态细分，提升对狭窄海峡/半岛的识别，减少“穿陆地”概率
            checkPathForLandAdaptive(fromLon, fromLat, toLon, toLat) {
                // 先用现有严格检测，快速捕获明显碰撞
                if (this.checkPathForLandStrict(fromLon, fromLat, toLon, toLat)) return true;

                const dx = toLon - fromLon;
                const dy = toLat - fromLat;
                const segLen = Math.sqrt(dx*dx + dy*dy);
                if (segLen === 0) return false;

                // 动态细分：基础 12，加长度系数（保证长步更密集）
                const steps = Math.min(80, Math.max(12, Math.ceil(segLen / 0.002)));
                const basePerp = Math.atan2(dy, dx) + Math.PI/2;
                // 垂直偏移距离：与段长相关，上限 0.06°
                const maxLateral = Math.min(0.06, 0.018 + segLen * 0.8);

                // 只在段较长或靠近复杂海岸（根据端点近岸距离）时启用偏移采样
                const nearCoastFactorStart = this.getDistanceToCoast ? (this.getDistanceToCoast(fromLon, fromLat) || 1) : 1;
                const nearCoastFactorEnd = this.getDistanceToCoast ? (this.getDistanceToCoast(toLon, toLat) || 1) : 1;
                const enableLateral = segLen > 0.015 || (nearCoastFactorStart < 0.4 || nearCoastFactorEnd < 0.4);

                for (let i = 0; i <= steps; i++) {
                    const t = i / steps;
                    const cx = fromLon + dx * t;
                    const cy = fromLat + dy * t;

                    // 中心采样
                    if (this.isDefinitelyLand(cx, cy)) {
                        console.log(`🛑A 粒子 #${this.id} 自适应中心采样撞陆 (${cy.toFixed(4)}°, ${cx.toFixed(4)}°)`);
                        return true;
                    }

                    if (enableLateral) {
                        // t*(1-t) 形成中段最宽，两端收窄，避免误判端点
                        const scale = (t * (1 - t));
                        if (scale > 0) {
                            const lateralDist = maxLateral * scale; // 钟形分布
                            const ox = Math.cos(basePerp) * lateralDist;
                            const oy = Math.sin(basePerp) * lateralDist;

                            // 正/负侧偏移
                            const p1Lon = cx + ox, p1Lat = cy + oy;
                            const p2Lon = cx - ox, p2Lat = cy - oy;

                            if (this.isDefinitelyLand(p1Lon, p1Lat) || this.isDefinitelyLand(p2Lon, p2Lat)) {
                                console.log(`🛑B 粒子 #${this.id} 侧向偏移采样撞陆 (t=${t.toFixed(2)})`);
                                return true;
                            }
                        }
                    }
                }

                return false;
            }
            
            // 检查移动路径上是否有陆地
            checkPathForLand(fromLon, fromLat, toLon, toLat) {
                // 检查从起点到终点的路径上是否经过陆地
                const steps = Math.max(5, Math.ceil(Math.abs(toLon - fromLon) / 0.1 + Math.abs(toLat - fromLat) / 0.1));
                
                for (let i = 0; i <= steps; i++) {
                    const t = i / steps;
                    const checkLon = fromLon + (toLon - fromLon) * t;
                    const checkLat = fromLat + (toLat - fromLat) * t;
                    
                    if (this.checkLandCollision(checkLon, checkLat)) {
                        return true;
                    }
                }
                
                return false;
            }
            
            // 计算海岸线接近度 (0 = 远离海岸, 1 = 非常接近海岸)
            getCoastalProximity(lon, lat) {
                const searchRadius = 2.0; // 搜索半径（度）
                const stepSize = 0.2; // 检测步长
                
                let minDistanceToLand = Infinity;
                let landPoints = 0;
                let totalPoints = 0;
                
                // 在周围区域搜索陆地点
                for (let dLon = -searchRadius; dLon <= searchRadius; dLon += stepSize) {
                    for (let dLat = -searchRadius; dLat <= searchRadius; dLat += stepSize) {
                        const checkLon = lon + dLon;
                        const checkLat = lat + dLat;
                        
                        // 跳过越界点
                        if (checkLat < -90 || checkLat > 90) continue;
                        
                        totalPoints++;
                        
                        if (this.checkLandCollision(checkLon, checkLat)) {
                            landPoints++;
                            const distance = Math.sqrt(dLon * dLon + dLat * dLat);
                            minDistanceToLand = Math.min(minDistanceToLand, distance);
                        }
                    }
                }
                
                if (minDistanceToLand === Infinity) {
                    return 0; // 没有找到附近的陆地
                }
                
                // 综合考虑最近距离和周围陆地密度
                const distanceProximity = Math.max(0, 1 - minDistanceToLand / searchRadius);
                const densityProximity = landPoints / totalPoints;
                
                return Math.min(1, (distanceProximity * 0.7 + densityProximity * 0.3));
            }
            
            // 严格的颜色检测陆地算法 - 只检测真正的陆地
            checkStrictLandDetection(lon, lat) {
                // 预测下一步位置
                const futureSteps = 2; // 检测前方2步的位置
                const stepSize = 0.015; // 每步0.015度（减少步长）
                
                // 检查当前位置及前方区域
                for (let step = 0; step <= futureSteps; step++) {
                    const checkLon = lon + this.vlon * stepSize * step;
                    const checkLat = lat + this.vlat * stepSize * step;
                    
                    // 边界检查
                    if (checkLat < -90 || checkLat > 90) return true;
                    
                    // 规范化经度
                    let normLon = checkLon;
                    while (normLon > 180) normLon -= 360;
                    while (normLon < -180) normLon += 360;

            getDistanceToCoastEfficient(lon, lat) {

            findBestOceanDirection(lon, lat) {

                    { dlon: -0.1, dlat: 0, weight: 0 },   // 西
                    { dlon: 0, dlat: 0.1, weight: 0 },    // 北

            // 欧亚大陆详细检测
            isInEurasia(lon, lat) {

            isInSouthAmerica(lon, lat) {

            isInOceania(lon, lat) {

                if (lon >= 110 && lon <= 155 && lat >= -45 && lat <= -10) return true;

                if (lon >= 166 && lon <= 179 && lat >= -47 && lat <= -34) return true;

            // 主要岛屿检测
            isInMajorIslands(lon, lat) {

                if (lon >= -8 && lon <= 2 && lat >= 50 && lat <= 61) {

                if (lon >= 129 && lon <= 146 && lat >= 30 && lat <= 46) {

                // 印尼主要岛屿 - 排除新加坡海峡
                if (lon >= 95 && lon <= 141 && lat >= -11 && lat <= 6) {

                // 菲律宾群岛 - 排除主要海峡

                    if (lon >= 120 && lon <= 121 && lat >= 14 && lat <= 15) return false;

                }
                
                return false;
            }
            
            // 智能沿海岸运动算法
            getCoastalMovement(lon, lat, vlon, vlat) {
                const step = 0.02; // 增加步长，使检测更严格
                let attemptCount = 0;
                const maxAttempts = 3; // 减少尝试次数，更容易搁浅
                
                // 只尝试几个最可能的沿岸方向
                const directions = [
                    // 沿岸方向 (垂直于原速度方向)
                    { vlon: -vlat * 0.8, vlat: vlon * 0.8 },
                    { vlon: vlat * 0.8, vlat: -vlon * 0.8 },
                    
                    // 平行但反向 (尝试远离海岸)
                    { vlon: -vlon * 0.5, vlat: -vlat * 0.5 }
                ];
                
                // 测试每个方向
                for (const dir of directions) {
                    attemptCount++;
                    if (attemptCount > maxAttempts) break;
                    
                    let testLon = lon + dir.vlon * step;
                    let testLat = lat + dir.vlat * step;
                    
                    // 处理经度边界
                    if (testLon > 180) testLon -= 360;
                    if (testLon < -180) testLon += 360;
                    
                    // 检查是否在有效范围内
                    if (testLat >= -89 && testLat <= 89) {
                        // 更严格的检测：不仅检查目标点，还要检查路径
                        if (!this.checkPathForLand(lon, lat, testLon, testLat)) {
                            console.log(`🌊 粒子 #${this.id} 找到沿岸路径，尝试第${attemptCount}次`);
                            return dir;
                        }
                    }
                }
                
                // 如果所有方向都被阻挡，返回零速度 (粒子将搁浅)
                console.log(`🏖️ 粒子 #${this.id} 无法找到安全路径，准备搁浅`);
                return { vlon: 0, vlat: 0 };
            }
            
            // 健壮的轨迹显示系统 - 处理各种异常情况
            updateTrailDisplay() {
                // 加强的健壮性检查 - 防止粒子间相互干扰
                if (!this.trail || !trailLayer || !this.isActive) {
                    console.warn(`⚠️ 粒子 #${this.id} 轨迹显示跳过: trail=${!!this.trail}, trailLayer=${!!trailLayer}, isActive=${this.isActive}`);
                    return;
                }
                
                // 确保轨迹有效数据 - 至少需要1个点来显示起始位置
                if (this.trail.length < 1) {
                    console.warn(`⚠️ 粒子 #${this.id} 没有轨迹数据，跳过显示`);
                    return; // 至少需要1个点
                }
                
                // 防止重复更新 - 使用更新锁
                if (this.isUpdatingTrail) {
                    return;
                }
                this.isUpdatingTrail = true;
                
                try {
                    // 数据验证 - 过滤无效点
                    const validTrail = this.trail.filter(point => 
                        point && 
                        typeof point.lat === 'number' && 
                        typeof point.lon === 'number' && 
                        !isNaN(point.lat) && 
                        !isNaN(point.lon) &&
                        point.lat >= -90 && point.lat <= 90 &&
                        point.lon >= -180 && point.lon <= 180
                    );
                    
                    if (validTrail.length < 1) {
                        console.warn(`⚠️ 粒子 #${this.id} 没有有效轨迹点: ${validTrail.length}/${this.trail.length}`);
                        return;
                    }
                    
                    // 个体化的轨迹颜色
                    const hue = (this.id * 37) % 360; // 基于ID的颜色
                    const trailColor = `hsl(${hue}, 70%, 50%)`;
                    
                    // 确保轨迹线存在并且有足够的点
                    if (!this.trailPolyline && validTrail.length >= 2) {
                        try {
                            this.trailPolyline = L.polyline([], {
                                color: trailColor,
                                weight: 2,
                                opacity: 0.7,
                                smoothFactor: 1.0
                            });
                            trailLayer.addLayer(this.trailPolyline);
                            this.trailDots = [];
                        } catch (e) {
                            console.warn(`粒子 #${this.id} 轨迹线创建失败:`, e);
                            this.trailPolyline = null;
                        }
                    }
                    
                    // 只有新增轨迹点时才更新
                    if (validTrail.length > this.lastTrailUpdate) {
                        // 更新轨迹线 - 确保轨迹线存在且有效
                        if (this.trailPolyline && validTrail.length >= 2) {
                            try {
                                const latLngs = validTrail.map(point => [point.lat, point.lon]);
                                this.trailPolyline.setLatLngs(latLngs);
                            } catch (e) {
                                console.warn(`粒子 #${this.id} 轨迹线更新失败:`, e);
                                // 重置轨迹线，下次重新创建
                                if (this.trailPolyline && trailLayer.hasLayer(this.trailPolyline)) {
                                    trailLayer.removeLayer(this.trailPolyline);
                                }
                                this.trailPolyline = null;
                            }
                        }
                        
                        // 安全清除旧的轨迹点
                        if (this.trailDots && this.trailDots.length > 0) {
                            this.trailDots.forEach(dot => {
                                try {
                                    if (dot && trailLayer.hasLayer(dot)) {
                                        trailLayer.removeLayer(dot);
                                    }
                                } catch (e) {
                                    console.warn(`清除轨迹点时出错 (粒子 #${this.id}):`, e);
                                }
                            });
                            this.trailDots = [];
                        }
                        
                        // 添加轨迹标记 - 处理单点和多点情况
                        if (validTrail.length >= 1) {
                            try {
                                if (validTrail.length === 1) {
                                    // 只有一个点时，显示为起始标记
                                    const startPoint = validTrail[0];
                                    const startDot = L.circleMarker([startPoint.lat, startPoint.lon], {
                                        radius: 4,
                                        fillColor: trailColor,
                                        color: '#2E7D32',
                                        weight: 2,
                                        opacity: 0.9,
                                        fillOpacity: 0.7
                                    });
                                    trailLayer.addLayer(startDot);
                                    this.trailDots.push(startDot);
                                } else {
                                    // 多个点时显示起点和终点
                                    // 起点标记
                                    const startPoint = validTrail[0];
                                    const startDot = L.circleMarker([startPoint.lat, startPoint.lon], {
                                        radius: 3,
                                        fillColor: '#4CAF50',
                                        color: '#2E7D32',
                                        weight: 1,
                                        opacity: 0.8,
                                        fillOpacity: 0.6
                                    });
                                    trailLayer.addLayer(startDot);
                                    this.trailDots.push(startDot);
                                    
                                    // 当前位置标记（轨迹终点）
                                    const endPoint = validTrail[validTrail.length - 1];
                                    const endDot = L.circleMarker([endPoint.lat, endPoint.lon], {
                                        radius: 4,
                                        fillColor: '#FF5722',
                                        color: '#D84315',
                                        weight: 1,
                                        opacity: 1.0,
                                        fillOpacity: 0.8
                                    });
                                    trailLayer.addLayer(endDot);
                                    this.trailDots.push(endDot);
                                }
                            } catch (e) {
                                console.warn(`创建轨迹标记时出错 (粒子 #${this.id}):`, e);
                            }
                        }
                        
                        this.lastTrailUpdate = validTrail.length;
                    }
                    
                } catch (e) {
                    console.error(`🚫 粒子 #${this.id} 轨迹显示更新失败 [轨迹点数: ${this.trail?.length || 0}, 轨迹线: ${!!this.trailPolyline}]:`, e.message);
                    
                    // 安全清理轨迹显示对象
                    try {
                        if (this.trailPolyline && trailLayer && trailLayer.hasLayer(this.trailPolyline)) {
                            trailLayer.removeLayer(this.trailPolyline);
                        }
                        if (this.trailDots && Array.isArray(this.trailDots)) {
                            this.trailDots.forEach(dot => {
                                if (dot && trailLayer && trailLayer.hasLayer(dot)) {
                                    trailLayer.removeLayer(dot);
                                }
                            });
                        }
                    } catch (cleanupError) {
                        console.warn(`⚠️ 粒子 #${this.id} 轨迹清理失败:`, cleanupError.message);
                    }
                    
                    // 重置轨迹显示状态，下次重新尝试
                    this.trailPolyline = null;
                    this.trailDots = [];
                    this.lastTrailUpdate = 0;
                } finally {
                    // 释放更新锁
                    this.isUpdatingTrail = false;
                }
            }
        }

        // 全局地图变量
        let map;
        let particleLayer;
        let trailLayer; // 轨迹图层
        let trailCanvas; // Canvas轨迹绘制
        let trailContext; // Canvas绘制上下文

        // Canvas轨迹系统初始化
        function initializeCanvasTrails() {
            // 创建Canvas元素
            trailCanvas = document.createElement('canvas');
            trailCanvas.style.position = 'absolute';
            trailCanvas.style.top = '0';
            trailCanvas.style.left = '0';
            trailCanvas.style.pointerEvents = 'none'; // 不拦截鼠标事件
            trailCanvas.style.zIndex = '400'; // 在地图上方，但在控件下方
            
            // 获取地图容器并添加Canvas
            const mapContainer = map.getContainer();
            mapContainer.appendChild(trailCanvas);
            
            // 设置Canvas大小
            updateCanvasSize();
            
            // 获取绘制上下文
            trailContext = trailCanvas.getContext('2d');
            trailContext.lineCap = 'round';
            trailContext.lineJoin = 'round';
            
            // 设置为全局变量
            window.trailContext = trailContext;
            window.map = map;
            
            // 监听地图大小变化
            map.on('resize', updateCanvasSize);
            map.on('zoom', clearTrailCanvas);
            map.on('move', redrawAllTrails);
            
            console.log('🎨 Canvas轨迹系统已初始化');
        }
        
        // 更新Canvas大小
        function updateCanvasSize() {
            if (!trailCanvas || !map) return;
            
            const size = map.getSize();
            trailCanvas.width = size.x;
            trailCanvas.height = size.y;
        }
        
        // 清除Canvas轨迹
        function clearTrailCanvas() {
            if (!trailContext) return;
            trailContext.clearRect(0, 0, trailCanvas.width, trailCanvas.height);
        }
        
        // 重绘所有轨迹 (地图移动时)
        function redrawAllTrails() {
            if (!trailContext) return;
            clearTrailCanvas();
            
            // 重绘所有活跃粒子的轨迹
            for (let particle of particles) {
                if (particle.isActive && particle.trail.length >= 2) {
                    drawParticleTrail(particle);
                }
            }
        }
        
        // 绘制单个粒子的轨迹（应用简化海洋漂流轨迹算法）
        function drawParticleTrail(particle) {
            if (!trailContext || !particle.trail || particle.trail.length < 2) return;
            
            try {
                trailContext.strokeStyle = '#1976d2';
                trailContext.lineWidth = 2;
                
                // 应用智能分段绘制，避免跨边界连线
                for (let i = 1; i < particle.trail.length; i++) {
                    const prevPoint = particle.trail[i-1];
                    const currPoint = particle.trail[i];
                    
                    if (!prevPoint || !currPoint || 
                        isNaN(prevPoint.lat) || isNaN(prevPoint.lon) ||
                        isNaN(currPoint.lat) || isNaN(currPoint.lon)) continue;
                    
                    // 检测大幅度跳跃（经度或纬度差异过大）
                    const lonDiff = Math.abs(currPoint.lon - prevPoint.lon);
                    const latDiff = Math.abs(currPoint.lat - prevPoint.lat);
                    
                    // 如果经度差超过180度，可能是跨越国际日期变更线，跳过连线
                    // 如果纬度或经度差异过大，认为是异常跳跃，跳过连线
                    if (lonDiff > 180 || latDiff > 10 || lonDiff > 10) {
                        continue; // 跳过这段连线
                    }
                    
                    // 将地理坐标转换为像素坐标
                    const prevPixel = map.latLngToContainerPoint([prevPoint.lat, prevPoint.lon]);
                    const currPixel = map.latLngToContainerPoint([currPoint.lat, currPoint.lon]);
                    
                    // 检测像素级别的大距离跳跃
                    const pixelDist = Math.sqrt(
                        Math.pow(currPixel.x - prevPixel.x, 2) + 
                        Math.pow(currPixel.y - prevPixel.y, 2)
                    );
                    
                    // 获取地图容器尺寸用于跳跃检测
                    const mapSize = map.getSize();
                    const maxReasonableDistance = Math.min(mapSize.x, mapSize.y) / 3;
                    
                    // 如果像素距离过大，跳过这段连线
                    if (pixelDist > maxReasonableDistance) {
                        continue;
                    }
                    
                    // 轨迹透明度渐变：越新的越不透明
                    const alpha = 0.3 + (i / particle.trail.length) * 0.5;
                    trailContext.globalAlpha = alpha;
                    
                    trailContext.beginPath();
                    trailContext.moveTo(prevPixel.x, prevPixel.y);
                    trailContext.lineTo(currPixel.x, currPixel.y);
                    trailContext.stroke();
                }
                
                trailContext.globalAlpha = 1.0;
            } catch (error) {
                console.warn(`绘制粒子 #${particle.id} 轨迹失败:`, error);
            }
        }
        
        // 错误处理函数
        function handleError(error, context) {
            console.warn(`[${context}] 错误处理:`, error.message || error);
            // 不让错误阻止程序运行
        }

        // 添加全局错误处理
        window.addEventListener('error', function(event) {
            handleError(event.error, 'Global Error');
            return true; // 阻止默认错误处理
        });
        
        // 处理unhandled promise rejections
        window.addEventListener('unhandledrejection', function(event) {
            handleError(event.reason, 'Unhandled Promise');
            event.preventDefault(); // 阻止默认处理
        });
        
        // 消息通道错误处理
        window.addEventListener('messageerror', function(event) {
            console.warn('Message channel error:', event);
        });

        // 初始化Leaflet地图
    function initMap() {

                                // 创建地图实例

                                    {"type":"Feature","properties":{"name":"Africa"},"geometry":{"type":"Polygon","coordinates":[[[-20,-35],[55,-35],[55,35],[-20,35],[-20,-35]]]}},

                                function addTwoColorLand(mode,geo){

                                    const tag=document.createElement('div'); tag.textContent='灰白底图 '+mode; tag.style.cssText='position:absolute;right:8px;bottom:8px;font-size:11px;color:#3a4759;background:rgba(255,255,255,0.55);padding:4px 8px;border-radius:6px;letter-spacing:.05em;backdrop-filter:blur(4px);box-shadow:0 2px 6px -2px rgba(0,0,0,0.35);'; mapEl && mapEl.appendChild(tag);
                                    console.log('[Map] 使用灰白底图模式(跳过过渡):',mode);

                                // ===== 在线底图优先加载（非 file://） =====
                                let tileFailed=0; let tileLayerInstance=null; let fallbackArmed=false;
                                function armFallback(reason){ if(fallbackArmed) return; fallbackArmed=true; console.warn('[Map] 准备回退双色底图:',reason); addTwoColorLand(reason||'回退',SIMPLE_LAND_INLINE); }

                                // ==== 稳定双色 / 在线底图模式：file 默认双色，http 默认在线，可用 ?basemap=two/online 控制 ====
                                const qs=new URLSearchParams(location.search);

                                const preferOnline = (!isFile && paramBasemap!=='two') || (isFile && paramBasemap==='online');
                                let currentMode = preferOnline ? 'online' : 'two';

                                // 切换按钮

                                toggleBtn.style.cssText='position:absolute;top:10px;right:10px;z-index:1200;padding:6px 12px;background:rgba(0,0,0,0.45);color:#fff;border:1px solid rgba(255,255,255,0.25);backdrop-filter:blur(6px);border-radius:6px;font-size:12px;cursor:pointer;';
                                mapEl.appendChild(toggleBtn);
                                function setToggleText(){ toggleBtn.textContent = currentMode==='online' ? '切换到稳定双色' : '尝试在线底图'; }
                                setToggleText();

                                const _origArmFallback = armFallback;
                                armFallback = function(reason){
                                    _origArmFallback(reason);

                                    if(isFile){
                                        const tip=document.createElement('div');
                                        tip.innerHTML='离线双色模式 (file)。<br>若需在线底图: 1) 运行 "启动平台.bat" 选择 server 模式 或 "python -m http.server"; 2) 地址栏添加 ?basemap=online (可加 &provider=osm 等).<br><span style="color:#f8bbd0">安全提示:</span> 如控制台仍出现第三方统计拦截日志，多为浏览器扩展注入, 可在隐身窗口测试。';
                                        tip.style.cssText='position:absolute;left:8px;bottom:8px;font-size:11px;color:#ffdd99;background:rgba(0,0,0,0.45);padding:6px 10px;border-radius:8px;max-width:300px;line-height:1.45;';

                                toggleBtn.addEventListener('click',()=>{
                                    if(currentMode==='online'){
                                        if(!fallbackArmed) armFallback('手动切换');

                                        currentMode='online'; setToggleText();
                                        tryOnline();

                                });

                                function tryOnline(){
                                    if(onlineTried) return; onlineTried=true;
                                    // 多候选源 (深/浅/灰/户外/地形等) 按顺序回退; 支持 ?provider= 指定优先
                                    let candidates=[
                                      {key:'cartodark', name:'Carto Dark', url:'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', subdomains:'abcd', attr:'©Carto ©OpenStreetMap'},
                                      {key:'cartolight', name:'Carto Light', url:'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', subdomains:'abcd', attr:'©Carto ©OpenStreetMap'},
                                      {key:'osm', name:'OpenStreetMap', url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png', attr:'©OpenStreetMap'},
                                      {key:'esri', name:'Esri Gray', url:'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', attr:'Tiles © Esri'},
                                      {key:'opentopo', name:'OpenTopoMap', url:'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', subdomains:'abc', attr:'©OpenTopoMap ©OpenStreetMap'},
                                      {key:'stamenwater', name:'Stamen Watercolor', url:'https://stamen-tiles.a.ssl.fastly.net/watercolor/{z}/{x}/{y}.jpg', attr:'©Stamen'},
                                      {key:'gsi', name:'GSI Pale (JP)', url:'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', attr:'©GSI Japan'}
                                    ];
                                    if(paramProvider){
                                        const preferred=candidates.filter(c=>c.key===paramProvider);
                                        const others=candidates.filter(c=>c.key!==paramProvider);
                                        if(preferred.length){ candidates=[...preferred,...others]; console.log('[Map] provider 优先:',paramProvider); }
                                    }
                                    let idx=0; let success=false;
                                    function next(){
                                        if(idx>=candidates.length){ if(!success){ if(!fallbackArmed) armFallback('在线失败'); currentMode='two'; setToggleText(); } return; }
                                        const c=candidates[idx++];
                                        console.log('[Map] 尝试在线底图源',c.name,'('+c.key+')');
                                        tileFailed=0; let first=false;
                                        const opts={attribution:c.attr,maxZoom: (c.key==='opentopo'?17: 8), crossOrigin:true}; if(c.url.includes('{s}')) opts.subdomains=c.subdomains||'abc';
                                        try{ if(tileLayerInstance) tileLayerInstance.remove(); }catch(e){}
                                        tileLayerInstance=L.tileLayer(c.url,opts);
                                        tileLayerInstance.on('tileerror',()=>{ tileFailed++; if(tileFailed>2 && !first){ try{tileLayerInstance.remove();}catch(e){}; next(); }});
                                        tileLayerInstance.on('load',()=>{ if(!first){ first=true; success=true; currentMode='online'; setToggleText(); updateStatus('🗺️ 在线底图('+c.name+')'); console.log('[Map] 在线底图成功',c.name,'('+c.key+')'); } });
                                        tileLayerInstance.addTo(map);
                                        setTimeout(()=>{ if(!first){ console.warn('[Map] 源',c.name,'超时'); try{tileLayerInstance.remove();}catch(e){}; next(); } },6500);

                                if(preferOnline){ tryOnline(); } else { armFallback('稳定双色默认'); }
                                // 支持 ?basemap=two / ?basemap=online

                // ============== 宏观洋流调试图层 (?debug=currents) ==============
                if(qs.get('debug')==='currents'){
                    const currentDebugLayer = L.layerGroup().addTo(map);
                    const stepLat=10, stepLon=20; // 采样间隔
                    for(let lat=-70; lat<=70; lat+=stepLat){
                        for(let lon=-180; lon<=180; lon+=stepLon){
                            const tmpP={lon,lat};
                            // 复用粒子方法需要一个虚拟对象：挂载 getMacroCurrentVector
                            const macro = (new Particle(lon,lat,-999)).getMacroCurrentVector(lon,lat);
                            const mag = Math.sqrt(macro.u*macro.u+macro.v*macro.v)||1;
                            // 缩放箭头长度（度表示）
                            const len = 3 * (mag/1.8); // 最大 3°
                            const ux=macro.u/mag, uy=macro.v/mag;
                            const lat2=lat + uy*len*Math.cos(lat*Math.PI/180); // 近似
                            const lon2=lon + ux*len;
                            const line=L.polyline([[lat,lon],[lat2,lon2]],{color:'#ff8800',weight:2,opacity:0.7}).addTo(currentDebugLayer);
                            // 箭头小三角
                            const headLat=lat2, headLon=lon2;
                            const leftLat=headLat - uy*0.6 + ux*0.4; const leftLon=headLon - ux*0.6 - uy*0.4;
                            const rightLat=headLat - uy*0.6 - ux*0.4; const rightLon=headLon - ux*0.6 + uy*0.4;
                            L.polygon([[headLat,headLon],[leftLat,leftLon],[rightLat,rightLon]],{color:'#ff8800',weight:1,fillColor:'#ff8800',fillOpacity:0.7}).addTo(currentDebugLayer);
                        }
                    }
                    const badge=document.createElement('div');
                    badge.textContent='Macro Currents Debug';
                    badge.style.cssText='position:absolute;top:50px;right:10px;padding:4px 8px;background:rgba(0,0,0,0.55);color:#ffd28a;font-size:11px;border-radius:6px;z-index:1200;';
                    mapEl.appendChild(badge);
                }

                // 创建粒子图层
                particleLayer = L.layerGroup().addTo(map);
                
                // 创建轨迹图层
                trailLayer = L.layerGroup().addTo(map);
                
                // 暂时禁用Canvas轨迹系统，先恢复粒子显示
                // initializeCanvasTrails();
                console.log('⚠️ Canvas轨迹系统暂时禁用，使用简单轨迹模式');
                console.log('✅ 粒子图层和轨迹图层已创建');

                // 隐藏加载提示
                const loadingEl = document.getElementById('loading');
                if (loadingEl) {
                    loadingEl.style.display = 'none';
                }

                // 验证地图对象
                if (!map) {
                    throw new Error('地图对象创建失败');
                }
                if (!particleLayer) {
                    throw new Error('粒子图层创建失败');
                }
                if (!trailLayer) {
                    throw new Error('轨迹图层创建失败');
                }

                console.log('✅ 双色底图初始化成功');
                console.log('✅ 粒子图层和轨迹图层验证通过');
                updateStatus('🗺️ 双色底图加载完成');

            } catch (error) {
                console.error('地图初始化失败:', error);
                updateStatus('❌ 地图初始化失败: ' + error.message);
                
                const loadingEl = document.getElementById('loading');
                if (loadingEl) {
                    loadingEl.style.display = 'block';
                    loadingEl.textContent = '地图初始化失败，请检查网络连接';
                    loadingEl.style.color = '#ff6b6b';
