        }

        // 初始化
        async function init() {
            try {
                console.log('🚀 开始初始化海洋塑料漂流模拟系统...');
                
                // 检查必要的DOM元素
                const mapElement = document.getElementById('map');
                if (!mapElement) {
                    throw new Error('找不到地图容器元素 #map');
                }
                console.log('✅ 地图容器元素检查通过');
                
                // 检查Leaflet库
                if (typeof L === 'undefined') {
                    throw new Error('Leaflet库未加载');
                }
                console.log('✅ Leaflet库检查通过');
                
                // 等待一小段时间确保CSS加载完成
                await new Promise(resolve => setTimeout(resolve, 200));
                
                // 初始化随机洋流场
                console.log('🌊 初始化随机洋流场...');
                initializeGlobalNoiseField();
                
                // 初始化地图
                console.log('🗺️ 开始初始化Leaflet地图...');
                initMap();
                
                // 开始渲染循环
                console.log('🔄 开始动画循环...');
                animate(performance.now());
                
                console.log('✅ 海洋塑料漂流模拟系统初始化完成！');
                // 绑定宏观/噪声/季节控制面板事件
                (function(){
                    const macroSlider=document.getElementById('macroInfluenceSlider');
                    const noiseSlider=document.getElementById('noiseInfluenceSlider');
                    const seasonalChk=document.getElementById('seasonalToggle');
                    if(macroSlider){ macroSlider.addEventListener('input',e=>setMacroInfluence(e.target.value/100)); }
                    if(noiseSlider){ noiseSlider.addEventListener('input',e=>setNoiseInfluence(e.target.value/100)); }
                    if(seasonalChk){ seasonalChk.addEventListener('change',e=>toggleSeasonal(e.target.checked)); }
                })();
                
            } catch (error) {
                console.error('❌ 系统初始化失败:', error);
                updateStatus('❌ 系统初始化失败: ' + error.message);
                
                // 显示错误信息
                const mapElement = document.getElementById('map');
                if (mapElement) {
                    mapElement.innerHTML = `
                        <div style="display: flex; align-items: center; justify-content: center; height: 100%; 
                                    background: #1a1a2e; color: #ff6b6b; text-align: center; padding: 20px;">
                            <div>
                                <h3>地图初始化失败</h3>
                                <p>${error.message}</p>
                                <p>请检查网络连接并刷新页面</p>
                            </div>
                        </div>
                    `;
                }
            }
        }

        // Canvas函数已被Leaflet地图替代

        // GeoJSON加载函数已被Leaflet地图替代

        // Canvas绘图函数已被Leaflet地图替代

        let lastUpdateTime = 0;
        const UPDATE_INTERVAL = 150; // 优化更新频率，每150毫秒更新一次（应用简化海洋漂流算法设置）

        function animate(currentTime) {
            // 控制更新频率
            if (currentTime - lastUpdateTime < UPDATE_INTERVAL) {
                animationId = requestAnimationFrame(animate);
                return;
            }
            lastUpdateTime = currentTime;
            
            // 更新潮汐周期
            tidalCycle += tidalSpeed;
            if (tidalCycle > 1) tidalCycle = 0;
            
            // 更新粒子
            const speedMultiplier = parseFloat(document.getElementById('particle-speed').value) * 0.05; // 大幅降低速度倍数
            
            if (isSimulationRunning) {
                let activeCount = 0;
                let noTrailCount = 0;
                
                for (let particle of particles) {
                    if (particle.isActive) {
                        // 严格验证粒子状态 - 防止"幽灵粒子"问题
                        if (isNaN(particle.lat) || isNaN(particle.lon) || 
                            particle.lat < -90 || particle.lat > 90 || 
                            particle.lon < -180 || particle.lon > 180) {
                            console.error(`💀 发现幽灵粒子 #${particle.id}: 坐标无效 (${particle.lat}, ${particle.lon})`);
                            particle.isActive = false;
                            updateStats();
                            continue;
                        }
                        
                        // 实时检测无轨迹粒子
                        const hasValidTrail = particle.trailPolyline || (particle.trailDots && particle.trailDots.length > 0);
                        const hasTrailData = particle.trail && particle.trail.length > 0;
                        
                        if (!hasValidTrail && !hasTrailData) {
                            noTrailCount++;
                            // 对无轨迹粒子进行额外的陆地检测
                            if (particle.checkLandCollision(particle.lon, particle.lat, false)) {
                                console.log(`🛑 实时停止无轨迹陆地粒子 #${particle.id} 在 (${particle.lat.toFixed(3)}°, ${particle.lon.toFixed(3)}°)`);
                                particle.isActive = false;
                                updateStats();
                                continue;
                            }
                        }
                        
                        // 最后进行位置更新
                        particle.update(speedMultiplier);
                        
                        // 粒子死亡后不再重生，保持死亡状态
                        // （已移除重生逻辑）
                        
                        if (particle.isActive) {
                            activeCount++;
                        }
                    }
                }
                
                // 更新模拟时间
                const now = Date.now();
                
                // 显示粒子状态信息和严格检测状态
                const simulationRuntime = (now - simulationStartTime) / 1000;
                const strictDetectionEnabled = simulationRuntime >= 30;
                
                if (noTrailCount > 0) {
                    const detectionMode = strictDetectionEnabled ? '🔍 严格颜色检测' : '🏖️ 标准检测';
                    updateStatus(`⚠️ 运行中 - ${noTrailCount} 个无轨迹粒子 | ${detectionMode} | ${simulationRuntime.toFixed(0)}s`);
                } else if (strictDetectionEnabled) {
                    updateStatus(`🌊 运行中 - 🔍 严格颜色检测已激活 | ${simulationRuntime.toFixed(0)}s`);
                } else {
                    const remainingTime = Math.max(0, 30 - simulationRuntime);
                    updateStatus(`🌊 运行中 - 🏖️ 标准检测模式 | 严格检测倒计时: ${remainingTime.toFixed(0)}s`);
                }
                
                // 如果没有活跃粒子，暂停模拟
                if (activeCount === 0) {
                    isSimulationRunning = false;
                    updateStatus('🏁 所有粒子已停止运动');
                }
                const elapsed = (now - simulationStartTime) / 1000; // 秒
                currentDay = Math.floor(elapsed / 5); // 每5秒代表一天，更慢
                document.getElementById('simulation-time').textContent = currentDay;
                
                // 检查是否达到模拟时长限制
                const maxDays = parseInt(document.getElementById('simulation-days').value);
                if (currentDay >= maxDays) {
                    isSimulationRunning = false;
                    updateStatus(`🏁 模拟完成 - 已达到设定的 ${maxDays} 天时长`);
                    console.log(`🏁 模拟在第 ${currentDay} 天停止 (限制: ${maxDays} 天)`);
                }
                
                // 更新潮汐状态显示
                const tidalPhase = Math.sin(tidalCycle * 2 * Math.PI);
                let tidalText;
                if (tidalPhase > 0.7) tidalText = '大潮';
                else if (tidalPhase > 0.3) tidalText = '涨潮';
                else if (tidalPhase > -0.3) tidalText = '平潮';
                else if (tidalPhase > -0.7) tidalText = '退潮';
                else tidalText = '干潮';
                document.getElementById('tidal-status').textContent = tidalText;
                
                // 更新统计信息
                updateStats();
            }
            
            // 更新Leaflet地图上的粒子显示
            updateParticlesOnMap();
            
            animationId = requestAnimationFrame(animate);
        }

        // 更新Leaflet地图上的粒子显示
        // 轨迹完整性检查和修复函数
        function checkAndRepairTrails() {
            let repairedCount = 0;
            let suspiciousCount = 0;
            let stoppedCount = 0;
            const activeParticles = particles.filter(p => p.isActive);
            const allParticles = particles.length;
            
            console.log(`🔍 检查 ${activeParticles.length}/${allParticles} 个粒子的轨迹完整性...`);
            
            // 首先检查所有粒子，确保已停止的粒子不会被意外处理
            for (let particle of particles) {
                if (!particle.isActive) {
                    stoppedCount++;
                    continue; // 跳过已停止的粒子，绝不修复已停止的粒子
                }
                
                // 只处理真正活跃的粒子
                const hasValidTrail = particle.trailPolyline || (particle.trailDots && particle.trailDots.length > 0);
                const hasTrailData = particle.trail && particle.trail.length > 0;
                
                // 检查无轨迹但仍在运动的粒子 - 这些可能是横冲直撞的粒子
                if (!hasValidTrail && !hasTrailData) {
                    suspiciousCount++;
                    console.warn(`⚠️ 粒子 #${particle.id} 无轨迹数据且无显示 - 可能横冲直撞 (${particle.lat.toFixed(3)}°, ${particle.lon.toFixed(3)}°)`);
                    
                    // 对这种粒子进行强制陆地检测
                    if (particle.checkLandCollision(particle.lon, particle.lat, false) || 
                        particle.isDefinitelyLand(particle.lon, particle.lat)) {
                        console.log(`� 停止无轨迹的陆地粒子 #${particle.id}`);
                        particle.isActive = false;
                        updateStats();
                        continue;
                    }
                    
                    // 强制初始化轨迹
                    particle.trail = [{
                        lon: particle.lon,
                        lat: particle.lat,
                        time: Date.now(),
                        day: Math.floor((Date.now() - simulationStartTime) / 2000)
                    }];
                    particle.updateTrailDisplay();
                    repairedCount++;
                    console.log(`🔄 为无轨迹粒子 #${particle.id} 强制初始化轨迹`);
                } else if (!hasValidTrail && hasTrailData) {
                    console.log(`�🔧 修复粒子 #${particle.id} 的轨迹显示 (轨迹点数: ${particle.trail.length})`);
                    particle.isUpdatingTrail = false; // 重置锁状态
                    particle.lastTrailUpdate = 0;
                    particle.updateTrailDisplay();
                    repairedCount++;
                }
            }
            
            if (repairedCount > 0 || suspiciousCount > 0) {
                console.log(`✅ 修复了 ${repairedCount} 个粒子的轨迹显示，发现 ${suspiciousCount} 个可疑粒子`);
                updateStatus(`🔧 修复了 ${repairedCount} 个轨迹，检测到 ${suspiciousCount} 个异常粒子`);
            }
            
            return repairedCount;
        }

        // 粒子重复检测函数
        function detectDuplicateParticles() {
            const positionMap = new Map();
            let duplicateCount = 0;
            
            for (let particle of particles) {
                if (!particle.isActive) continue;
                
                const posKey = `${particle.lat.toFixed(6)}_${particle.lon.toFixed(6)}`;
                
                if (positionMap.has(posKey)) {
                    duplicateCount++;
                    const existing = positionMap.get(posKey);
                    console.warn(`🔄 发现重复位置粒子: #${particle.id} 和 #${existing.id} 都在 (${particle.lat.toFixed(6)}°, ${particle.lon.toFixed(6)}°)`);
                    
                    // 停止后来的粒子
                    if (particle.id > existing.id) {
                        console.log(`🛑 停止重复粒子 #${particle.id}`);
                        particle.isActive = false;
                        updateStats();
                    }
                } else {
                    positionMap.set(posKey, particle);
                }
            }
            
            if (duplicateCount > 0) {
                console.warn(`⚠️ 检测到 ${duplicateCount} 个重复位置粒子`);
                updateStatus(`⚠️ 发现 ${duplicateCount} 个重复粒子`);
            }
            
            return duplicateCount;
        }

        function updateParticlesOnMap() {
            if (!map || !particleLayer || !trailLayer) return;
            
            // 定期检测重复粒子
            if (particles.length > 0 && Math.random() < 0.1) { // 10%几率检测
                detectDuplicateParticles();
            }
            
            // 只清空粒子标记图层，保留轨迹图层
            particleLayer.clearLayers();
            
            let visibleParticles = 0;
            
            // 为每个活跃粒子添加标记和轨迹
            for (let particle of particles) {
                if (particle.isActive) {
                    // 验证坐标有效性
                    if (isNaN(particle.lat) || isNaN(particle.lon) || 
                        particle.lat < -90 || particle.lat > 90 || 
                        particle.lon < -180 || particle.lon > 180) {
                        console.warn(`粒子 #${particle.id} 坐标无效: lat=${particle.lat}, lon=${particle.lon}`);
                        particle.isActive = false;
                        continue;
                    }
                    
                    // 粒子当前位置标记
                    const marker = L.circleMarker([particle.lat, particle.lon], {
                        radius: 5,
                        color: '#ff4444',
                        fillColor: '#ff6b35', 
                        fillOpacity: 0.8,
                        weight: 1
                    });
                    
                    // 添加粒子信息弹窗
                    const latDir = particle.lat >= 0 ? 'N' : 'S';
                    const lonDir = particle.lon >= 0 ? 'E' : 'W';
                    marker.bindPopup(`
                        <strong>海洋塑料粒子 #${particle.id}</strong><br>
                        位置: ${Math.abs(particle.lat).toFixed(3)}°${latDir}, ${Math.abs(particle.lon).toFixed(3)}°${lonDir}<br>
                        漂流距离: ${particle.distanceTraveled.toFixed(1)} km<br>
                        轨迹点: ${particle.trail.length} 个 (已渲染: ${particle.lastTrailUpdate})<br>
                        速度: vlon=${particle.vlon.toFixed(4)}, vlat=${particle.vlat.toFixed(4)}<br>
                        轨迹线状态: ${particle.trailLine ? '已创建' : '未创建'}
                    `);
                    
                    particleLayer.addLayer(marker);
                    visibleParticles++;
                    
                    // 更新轨迹显示 - 增强检测和修复机制
                    const hasValidTrail = particle.trailPolyline || (particle.trailDots && particle.trailDots.length > 0);
                    const hasTrailData = particle.trail && particle.trail.length > 0;
                    
                    if (!hasValidTrail && hasTrailData && !particle.isUpdatingTrail) {
                        // 强制为没有轨迹显示的粒子创建轨迹
                        console.log(`🔧 强制为粒子 #${particle.id} 创建轨迹显示 (轨迹点数: ${particle.trail.length})`);
                        particle.updateTrailDisplay();
                    } else if (hasValidTrail && !particle.isUpdatingTrail) {
                        // 正常更新现有轨迹
                        particle.updateTrailDisplay();
                    }
                    
                    // 额外的验证 - 如果粒子活跃但完全没有任何显示元素
                    if (!particle.trailPolyline && (!particle.trailDots || particle.trailDots.length === 0) && hasTrailData) {
                        console.warn(`⚠️ 粒子 #${particle.id} 丢失所有轨迹显示元素，正在恢复...`);
                        // 重置状态并重新创建
                        particle.lastTrailUpdate = 0;
                        setTimeout(() => {
                            if (particle.isActive && !particle.isUpdatingTrail) {
                                particle.updateTrailDisplay();
                            }
                        }, 200);
                    }
                }
            }
            
            // 调试信息
            if (visibleParticles !== particles.filter(p => p.isActive).length) {
                console.log(`显示粒子数: ${visibleParticles}, 活跃粒子数: ${particles.filter(p => p.isActive).length}`);
            }
        }

        // 控制函数
        function startSimulation() {
            // 如果正在运行，先停止当前模拟
            if (isSimulationRunning) {
                stopSimulation();
            }
            
            // 重置模拟状态
            isSimulationRunning = false;
            
            // 先进行调试测试
            debugLandDetection();
            
            const particleCount = parseInt(document.getElementById('particle-count').value);
            const emissionPoint = document.getElementById('emission-point').value;
            
            // 清理之前的粒子和轨迹
            if (particles && particles.length > 0) {
                for (let particle of particles) {
                    if (particle.trailPolyline) {
                        trailLayer.removeLayer(particle.trailPolyline);
                    }
                    if (particle.trailDots) {
                        for (let dot of particle.trailDots) {
                            trailLayer.removeLayer(dot);
                        }
                    }
                }
                console.log(`🧹 清理了 ${particles.length} 个旧粒子的轨迹`);
            }
            
            // 清理轨迹图层
            if (trailLayer) {
                trailLayer.clearLayers();
            }
            
            // 生成新粒子
            particles = [];
            let safeParticles = 0;
            let landParticles = 0;
            
            for (let i = 0; i < particleCount; i++) {
                let position;
                let attempts = 0;
                let isOnLand = true;
                
                // 使用改进的安全海域发射点算法
                position = getEmissionPosition(emissionPoint);
                console.log(`🎯 粒子 #${i} 获得基础发射位置: lon=${position.lon}, lat=${position.lat}`);
                
                // 智能随机偏移 - 确保在安全海域内
                let finalPosition = null;
                let offsetAttempts = 0;
                const maxOffsetAttempts = 8;
                
                // 尝试在安全区域内找到合适的偏移位置
                while (!finalPosition && offsetAttempts < maxOffsetAttempts) {
                    const offsetRange = 0.05 + (offsetAttempts * 0.02); // 动态增加偏移范围
                    const testLon = position.lon + (Math.random() - 0.5) * offsetRange;
                    const testLat = position.lat + (Math.random() - 0.5) * offsetRange;
                    
                    // 验证偏移后的位置是否安全
                    const tempParticle = new Particle(testLon, testLat, -1);
                    if (!tempParticle.isDefinitelyLand(testLon, testLat)) {
                        finalPosition = { lon: testLon, lat: testLat };
                        console.log(`✅ 粒子 #${i} 找到安全偏移位置: (${testLat.toFixed(4)}, ${testLon.toFixed(4)}) 偏移范围: ${offsetRange.toFixed(3)}`);
                    }
                    offsetAttempts++;
                }
                
                // 如果找不到合适的偏移位置，使用原始位置
                if (!finalPosition) {
                    finalPosition = position;
                    console.log(`🔄 粒子 #${i} 使用原始位置: (${position.lat.toFixed(4)}, ${position.lon.toFixed(4)})`);
                }
                
                position = finalPosition;
                
                // 最终安全验证
                const tempParticle = new Particle(position.lon, position.lat, -1);
                isOnLand = tempParticle.isDefinitelyLand(position.lon, position.lat);
                console.log(`🔍 最终位置检查: (${position.lat.toFixed(3)}, ${position.lon.toFixed(3)}) = ${isOnLand ? '❌ 陆地' : '✅ 海域'}`);
                
                // 如果最终位置仍然不安全，再次尝试原始位置
                if (isOnLand) {
                    position = getEmissionPosition(emissionPoint);
                    const verifyParticle = new Particle(position.lon, position.lat, -1);
                    isOnLand = verifyParticle.isDefinitelyLand(position.lon, position.lat);
                    console.log(`🔄 回退到原始安全点: (${position.lat.toFixed(3)}, ${position.lon.toFixed(3)}) = ${isOnLand ? '❌ 陆地' : '✅ 海域'}`);
                }
                
                if (!isOnLand) {
                    // 创建真正的粒子，传递发射点信息
                    const particle = new Particle(position.lon, position.lat, i, emissionPoint);
                    particles.push(particle);
                    safeParticles++;
                    
                    // 立即强制更新轨迹显示确保新粒子有轨迹
                    setTimeout(() => {
                        if (particle.isActive && particle.trail.length > 0) {
                            particle.updateTrailDisplay();
                        }
                    }, 100);
                    
                    console.log(`粒子 #${i} 创建于: lat=${position.lat.toFixed(3)}, lon=${position.lon.toFixed(3)} ✅ 海域中`);
                } else {
                    landParticles++;
                    console.warn(`⚠️ 粒子 #${i} 经过 ${attempts} 次尝试仍在陆地上，跳过创建`);
                }
            }
            
            console.log(`✅ 成功创建 ${safeParticles} 个海域粒子，跳过 ${landParticles} 个陆地粒子`);
            
            isSimulationRunning = true;
            simulationStartTime = Date.now();
            currentDay = 0;
            
            updateStatus(`🌊 开始模拟 ${particleCount} 个粒子从 ${getEmissionPointName(emissionPoint)}...`);
            updateStats();
            
            console.log(`模拟开始: ${particleCount} 个粒子, 发射点: ${emissionPoint}`);
            
            // 启动定期轨迹完整性检查
            const trailCheckInterval = setInterval(() => {
                if (!isSimulationRunning) {
                    clearInterval(trailCheckInterval);
                    return;
                }
                checkAndRepairTrails();
            }, 10000); // 每10秒检查一次
            
            // 启动自动随机洋流（每1分钟随机化一次洋流场）
            autoCurrentsInterval = setInterval(() => {
                if (!isSimulationRunning) {
                    clearInterval(autoCurrentsInterval);
                    return;
                }
                randomizeCurrents();
                console.log('🌊 自动随机洋流已更新');
            }, 60000); // 每1分钟随机化洋流
            
            // 启动粒子随机杀死定时器（每30秒随机杀死2%的粒子）
            particleKillInterval = setInterval(() => {
                if (!isSimulationRunning) {
                    clearInterval(particleKillInterval);
                    return;
                }
                killRandomParticles();
            }, 30000); // 每30秒杀死部分粒子
            
            // 初始轨迹检查，确保所有新粒子都有轨迹
            setTimeout(() => {
                if (isSimulationRunning) {
                    checkAndRepairTrails();
                }
            }, 2000);
        }
        
        // 获取发射点显示名称

        function pauseSimulation() {
            isSimulationRunning = !isSimulationRunning;
            updateStatus(isSimulationRunning ? '🌊 模拟运行中...' : '⏸️ 模拟已暂停');
        }

        function stopSimulation() {
            isSimulationRunning = false;
            
            // 清理所有定时器
            if (autoCurrentsInterval) {
                clearInterval(autoCurrentsInterval);
                autoCurrentsInterval = null;
            }
            
            if (particleKillInterval) {
                clearInterval(particleKillInterval);
                particleKillInterval = null;
            }
            
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            
            console.log('🛑 模拟已完全停止，所有定时器已清理');
            updateStatus('🛑 模拟已停止');
        }

        function resetSimulation() {
            isSimulationRunning = false;
            
            // 清理自动随机洋流定时器
            if (autoCurrentsInterval) {
                clearInterval(autoCurrentsInterval);
                autoCurrentsInterval = null;
                console.log('🛑 自动随机洋流定时器已清理');
            }
            
            // 清理粒子随机杀死定时器
            if (particleKillInterval) {
                clearInterval(particleKillInterval);
                particleKillInterval = null;
                console.log('🛑 粒子随机杀死定时器已清理');
            }
            
            // 先清理所有粒子的轨迹状态，避免内存泄漏和相互干扰
            for (let particle of particles) {
                if (particle.trailPolyline && trailLayer.hasLayer(particle.trailPolyline)) {
                    trailLayer.removeLayer(particle.trailPolyline);
                }
                if (particle.trailDots) {
                    particle.trailDots.forEach(dot => {
                        if (dot && trailLayer.hasLayer(dot)) {
                            trailLayer.removeLayer(dot);
                        }
                    });
                }
                // 重置粒子轨迹状态
                particle.trailPolyline = null;
                particle.trailDots = [];
                particle.lastTrailUpdate = 0;
                particle.isUpdatingTrail = false;
            }
            
            particles = [];
            currentDay = 0;
            
            // 清除地图上的粒子和轨迹
            if (particleLayer) {
                particleLayer.clearLayers();
                console.log('🗑️ 所有粒子已清除');
            }
            if (trailLayer) {
                trailLayer.clearLayers();
                console.log('🗑️ 所有轨迹已清除');
            }
            
            updateStatus('🔄 模拟已重置');
            updateStats();
        }

        // 随机海洋位置生成器（应用简化海洋漂流算法）
        function getRandomOceanPoint() {
            // 从现有的发射点中随机选择一个
            const emissionPoints = ['tokyo-bay', 'shanghai', 'hong-kong', 'singapore', 'mumbai', 
                                    'new-york', 'los-angeles', 'london', 'hamburg', 'rotterdam'];
            const randomEmissionPoint = emissionPoints[Math.floor(Math.random() * emissionPoints.length)];
            return getEmissionPosition(randomEmissionPoint);
        }

        function getEmissionPosition(emissionPoint) {
            // 重新设计的精确近海发射点 - 真实接近目标港口但在安全海域
            const preciseSafePoints = {
                // 中国沿海重要城市近海安全点
                'shanghai': {
                    centerLon: 122.0, centerLat: 30.8, // 上海外海约60公里
                    radius: 0.4, name: "长江口外海安全区"
                },
                // 珠三角统一发射点 - 香港、深圳、广州使用同一位置
                'hong-kong': {
                    centerLon: 114.3, centerLat: 22.3, // 珠三角中心外海
                    radius: 0.3, name: "珠三角统一发射点"
                },
                'shenzhen': {
                    centerLon: 114.3, centerLat: 22.3, // 珠三角中心外海 
                    radius: 0.3, name: "珠三角统一发射点"
                },
                'guangzhou': {
                    centerLon: 114.3, centerLat: 22.3, // 珠三角中心外海
                    radius: 0.3, name: "珠三角统一发射点"
                },
                'tianjin': {
                    centerLon: 118.0, centerLat: 38.8, // 天津滨海外海
                    radius: 0.4, name: "渤海湾外海安全区"
                },
                'dalian': {
                    centerLon: 121.8, centerLat: 38.8, // 大连港外海
                    radius: 0.4, name: "黄海北部安全区"
                },
                'qingdao': {
                    centerLon: 120.8, centerLat: 36.2, // 青岛胶州湾外海
                    radius: 0.4, name: "胶州湾外海安全区"
                },
                'xiamen': {
                    centerLon: 118.2, centerLat: 24.3, // 厦门湾外海
                    radius: 0.3, name: "厦门湾外海安全区"
                },
                'ningbo': {
                    centerLon: 122.2, centerLat: 29.6, // 宁波舟山港外海
                    radius: 0.4, name: "杭州湾外海安全区"
                },
                'haikou': {
                    centerLon: 110.5, centerLat: 20.2, // 海口秀英港外海
                    radius: 0.3, name: "琼州海峡北部"
                },
                'sanya': {
                    centerLon: 109.8, centerLat: 18.0, // 三亚凤凰岛外海
                    radius: 0.3, name: "南海北部安全区"
                }
            };

            // 获取对应的精确安全海域点
            let safePoint = preciseSafePoints[emissionPoint];
            if (!safePoint) {
                // 默认使用上海海域
                safePoint = preciseSafePoints['shanghai'];
            }

            // 智能位置生成 - 多次尝试确保在海域内
            let attempts = 0;
            let finalPosition = null;
            
            while (!finalPosition && attempts < 20) {
                // 在小范围内生成随机位置
                const angle = Math.random() * 2 * Math.PI;
                const distance = Math.random() * safePoint.radius * 0.8; // 使用80%半径确保安全
                const lon = safePoint.centerLon + distance * Math.cos(angle);
                const lat = safePoint.centerLat + distance * Math.sin(angle);
                
                // 基本边界检查
                if (lat >= -89 && lat <= 89 && lon >= -180 && lon <= 180) {
                    // 简单的陆地避免检查 - 避开明显的陆地区域
                    if (!isObviousLand(lon, lat)) {
                        finalPosition = { lon, lat };
                        console.log(`✅ 发射点生成成功: ${safePoint.name} (${lon.toFixed(4)}, ${lat.toFixed(4)}) 尝试次数: ${attempts + 1}`);
                        break;
                    }
                }
                attempts++;
            }
            
            // 如果多次尝试失败，使用保守的中心点
            if (!finalPosition) {
                finalPosition = { 
                    lon: safePoint.centerLon, 
                    lat: safePoint.centerLat 
                };
                console.warn(`⚠️ 使用保守中心点: ${safePoint.name} (${finalPosition.lon}, ${finalPosition.lat})`);
            }

            return finalPosition;
        }
        
        // 简单的明显陆地检测 - 避开大陆块
        function isObviousLand(lon, lat) {
            // 极地
            if (lat > 85 || lat < -85) return true;
            
            // 主要大陆的核心区域 - 保守检测
            // 亚洲大陆核心
            if (lon >= 50 && lon <= 150 && lat >= 10 && lat <= 70) {
                // 排除明显的海域
                if ((lon >= 100 && lon <= 130 && lat >= 0 && lat <= 30) || // 南海
                    (lon >= 125 && lon <= 145 && lat >= 25 && lat <= 50) || // 日本海
                    (lon >= 50 && lon <= 80 && lat >= 5 && lat <= 30)) {   // 阿拉伯海
                    return false;
                }
                return true;
            }
            
            // 欧洲核心
            if (lon >= -10 && lon <= 50 && lat >= 35 && lat <= 70) {
                // 排除地中海和北海
                if ((lon >= 0 && lon <= 40 && lat >= 30 && lat <= 45) ||   // 地中海
                    (lon >= -5 && lon <= 15 && lat >= 50 && lat <= 65)) {   // 北海
                    return false;
                }
                return true;
            }
            
            // 北美核心
            if (lon >= -170 && lon <= -50 && lat >= 20 && lat <= 80) return true;
            
            // 南美核心  
            if (lon >= -80 && lon <= -30 && lat >= -60 && lat <= 15) return true;
            
            // 非洲核心
            if (lon >= -20 && lon <= 55 && lat >= -35 && lat <= 40) return true;
            
            // 澳洲核心
            if (lon >= 110 && lon <= 160 && lat >= -45 && lat <= -10) return true;
            
            return false; // 默认认为是海洋
        }

        // 随机杀死2%的粒子（每30秒执行一次）
        function killRandomParticles() {
            if (!particles || particles.length === 0) return;
            
            // 只对活跃粒子进行随机杀死
            const aliveParticles = particles.filter(p => p.isActive && p.life > 0);
            if (aliveParticles.length === 0) return;
            
            // 计算要杀死的粒子数量（2%）
            const killCount = Math.max(1, Math.floor(aliveParticles.length * 0.02));
            
            // 随机选择要杀死的粒子
            const shuffled = [...aliveParticles].sort(() => Math.random() - 0.5);
            const particlesToKill = shuffled.slice(0, killCount);
            
            particlesToKill.forEach(particle => {
                particle.life = 0; // 杀死粒子
                particle.isActive = false;
                console.log(`💀 随机杀死粒子 #${particle.id} 位置: (${particle.lat.toFixed(3)}°, ${particle.lon.toFixed(3)}°)`);
            });
            
            console.log(`💀 已随机杀死 ${killCount} 个粒子，剩余活跃粒子: ${aliveParticles.length - killCount}`);
        }

            };
            
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ocean_simulation_${Date.now()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            updateStatus('📥 数据已导出');
        }

        // UI 更新
        function updateStatus(message) {
            document.getElementById('status').textContent = message;
        }

        function updateStats() {
            const activeParticles = particles.filter(p => p.isActive).length;
            const beachedParticles = particles.length - activeParticles;
            const avgDistance = particles.length > 0 ? 
                (particles.reduce((sum, p) => sum + p.distanceTraveled, 0) / particles.length * 0.1).toFixed(1) : 0;
            
            document.getElementById('active-particles').textContent = activeParticles;
            document.getElementById('beached-particles').textContent = beachedParticles;
            document.getElementById('avg-distance').textContent = avgDistance;
            
            // 调试信息 - 显示粒子运动统计
            if (particles.length > 0 && currentDay % 10 === 0) { // 每10天输出一次统计
                const speeds = particles.filter(p => p.isActive).map(p => 
                    Math.sqrt(p.vlon * p.vlon + p.vlat * p.vlat)
                );
                if (speeds.length > 0) {
                    const avgSpeed = speeds.reduce((a, b) => a + b) / speeds.length;
                    const minSpeed = Math.min(...speeds);
                    const maxSpeed = Math.max(...speeds);
                    console.log(`📊 第${currentDay}天统计: 平均速度=${avgSpeed.toFixed(6)}, 最小=${minSpeed.toFixed(6)}, 最大=${maxSpeed.toFixed(6)}, 活跃粒子=${speeds.length}`);
                }
            }
        }

        // 移动端侧边栏切换
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('active');
        }

        // 响应式处理
        function handleResize() {
            const toggle = document.querySelector('.sidebar-toggle');
            if (window.innerWidth <= 968) {
                toggle.style.display = 'block';
            } else {
                toggle.style.display = 'none';
                document.getElementById('sidebar').classList.remove('active');
            }
        }

        window.addEventListener('resize', handleResize);
        handleResize();

        // 初始化应用
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
